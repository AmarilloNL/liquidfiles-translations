        info_body_html: "<p>كلمة المرور المؤقتة سلسلة فريدة من الأرقام والحروف، على سبيل المثال:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>كلمة المرور المؤقتة هذه مجرد مثال لتوضيح شكلها – ولا يمكن استخدامها.</em></p><p>ستجد في صندوق الوارد <strong>رسالتين</strong>: إحداهما تحتوي على الرسالة الآمنة، والأخرى <strong>بموضوع يبدأ بـ: كلمة المرور المؤقتة</strong>. تحتوي الثانية على كلمة المرور المؤقتة الفريدة الخاصة بك لهذا النظام.</p><p>إذا لم تتلقَّ رسالة تحتوي على كلمة مرور مؤقتة، فقد يكون لديك حساب على هذا النظام بالفعل. في هذه الحالة، انقر على «تسجيل الدخول».</p><p>إذا كنت تعتقد أنه كان يجب أن تتلقى كلمة مرور مؤقتة ولم تتلقَّها، فانقر على «طلب كلمة مرور مؤقتة» للحصول على واحدة جديدة.</p>"
        email_address: عنوان البريد الإلكتروني
        email_not_permitted: غير مسموح لعنوان البريد الإلكتروني هذا بعرض هذه الرسالة الآمنة.
        email_not_permitted_description_html: <p>يُرجى التحقق من رسالة البريد الإلكتروني التي تلقيتها والتي تحتوي على الرسالة الآمنة، وأدخل عنوان البريد الإلكتروني تمامًا كما أُرسلت إليه الرسالة.</p><p>على سبيل المثال، إذا كان عنوانك يمكن أن يكون ahmed.alsaeed@sharika.com.sa وكذلك aalsaeed@sharika.com.sa، فلا يمكن للنظام أن يعرف أنهما العنوان نفسه. إذا أُرسلت الرسالة الآمنة إلى ahmed.alsaeed@sharika.com.sa، فهذا هو العنوان الذي يجب إدخاله هنا.</p><p>إذا لم تكن متأكدًا، فيُرجى التواصل مع مرسل الرسالة الآمنة.</p>
        email_can_login: لديك حساب على هذا النظام بالفعل
        email_can_login_description_html: <p>يمكنك تسجيل الدخول إلى هذا النظام باستخدام عنوان البريد الإلكتروني هذا وكلمة المرور الخاصة بك.</p><p>انقر على زر تسجيل الدخول أدناه لتسجيل الدخول بحسابك الحالي.</p>
        temporary_user_delivered_header: تم إرسال كلمة المرور المؤقتة
        temporary_user_delivered_description_html: <p>تم إرسال كلمة مرور مؤقتة إلى عنوان بريدك الإلكتروني. يُرجى التحقق من صندوق الوارد، وإغلاق هذه النافذة، وإدخال كلمة المرور المؤقتة.</p>
