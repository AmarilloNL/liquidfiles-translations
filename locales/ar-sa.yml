        description_html: <strong>مستخدمو Windows:</strong> يقيّد Windows مسارات الملفات بـ 259 حرفًا. عند تحميل مجلدات من مواقع ذات مسارات طويلة، قد يتم تخطي الملفات الموجودة في عمق بنية المجلدات دون تحذير، مما يؤدي إلى تحميل غير مكتمل أو مجلدات مكررة.
        workarounds_title: الحلول المقترحة
        workarounds_html: "<li><strong>استخدم محرك أقراص افتراضيًا:</strong> افتح موجّه الأوامر وشغّل: <code>subst X: \"C:\\masar\\taweel\\ila\\mujallad\"</code><br>ثم قم بالتحميل من محرك الأقراص الافتراضي <code>X:\\</code></li><li><strong>انتقل إلى موقع أقرب إلى الملفات:</strong> افتح مجلدًا فرعيًا أقرب إلى ملفاتك قبل تحديد مجلد التحميل</li><li><strong>استخدم مسارًا أقصر:</strong> انسخ ملفاتك إلى موقع أقصر، مثل <code>C:\\uploads\\</code>، قبل التحميل</li><li><strong>اضغط المجلد أولاً:</strong> اضغط المجلد في ملف ZIP وحمّل ملف ZIP بدلاً منه</li>"
        advanced_title: "متقدم: تفعيل المسارات الطويلة في Windows 10/11"
        advanced_description_html: بدءًا من الإصدار 1607 من Windows 10، يمكنك تفعيل دعم المسارات الأطول. <strong>ملاحظة:</strong> يتطلب ذلك صلاحيات المسؤول وقد لا يعمل في جميع المتصفحات. الحلول المذكورة أعلاه أكثر موثوقية.
        registry_steps_title: خطوات تفعيل المسارات الطويلة
        registry_steps_html: "<li>اضغط <kbd>Win + R</kbd>، واكتب <code>regedit</code> واضغط Enter</li><li>انتقل إلى: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>ابحث عن قيمة DWORD باسم <code>LongPathsEnabled</code> أو أنشئها، وعيّنها إلى <code>1</code></li><li>أعد تشغيل الكمبيوتر ليسري التغيير</li><li>أعد محاولة التحميل (قد يختلف الدعم حسب المتصفح)</li>"
        browser_disclaimer_html: "<strong>مهم:</strong> حتى مع تفعيل إعداد السجل هذا، يختلف دعم المسارات الطويلة حسب المتصفح. قد تستمر متصفحات Chrome وEdge وFirefox في تطبيق حد الـ 259 حرفًا. الحلول المذكورة أعلاه أكثر موثوقية."
