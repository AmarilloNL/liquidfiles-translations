        workarounds_title: Препоръчителни решения
        workarounds_html: "<li><strong>Използвайте виртуално устройство:</strong> отворете командния ред и изпълнете: <code>subst X: \"C:\\vashiyat\\dalag\\pat\\do\\papkata\"</code><br>След това качвайте от виртуалното устройство <code>X:\\</code></li><li><strong>Отидете по-близо до файловете:</strong> преди да изберете папката за качване, отворете подпапка по-близо до файловете</li><li><strong>Използвайте по-кратък път:</strong> преди качване копирайте файловете на по-кратко място, например <code>C:\\uploads\\</code></li><li><strong>Първо архивирайте папката:</strong> компресирайте папката в ZIP файл и качете ZIP файла вместо нея</li>"
        advanced_title: "Разширено: включване на дълги пътища в Windows 10/11"
        advanced_description_html: От Windows 10 версия 1607 можете да включите поддръжка на по-дълги пътища. <strong>Забележка:</strong> за това са необходими администраторски права и може да не работи във всички браузъри. Горните решения са по-надеждни.
        registry_steps_title: Стъпки за включване на дълги пътища
        registry_steps_html: "<li>Натиснете <kbd>Win + R</kbd>, въведете <code>regedit</code> и натиснете Enter</li><li>Отидете на: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Намерете или създайте стойност DWORD с име <code>LongPathsEnabled</code> и я задайте на <code>1</code></li><li>Рестартирайте компютъра, за да влезе промяната в сила</li><li>Опитайте отново качването (поддръжката може да се различава според браузъра)</li>"
        browser_disclaimer_html: "<strong>Важно:</strong> дори при включена тази настройка в системния регистър поддръжката на дълги пътища се различава според браузъра. Chrome, Edge и Firefox може все пак да прилагат ограничението от 259 знака. Горните решения са по-надеждни."
