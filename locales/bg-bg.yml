      show:
        title: Въведете временната си парола
        description_html: "На път сте да прегледате защитено съобщение. За да го отворите, трябва да въведете временната си парола.<br>Временната парола е уникален случаен низ, който ви идентифицира. Временната парола ви е изпратена в отделен имейл (тема: Временна парола)."
