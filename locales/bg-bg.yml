        submit: Проверка на временната парола
        submit_email: Изпращане
        if_you_have_account: "(ако вече имате акаунт)"
        request_temporary_user_header: Поискване на нова временна парола
        request_temporary_user_description_html: Можете да поискате нова временна парола, за да отворите това съобщение. Въведете имейл адреса си по-долу, за да поискате нова временна парола за това защитено съобщение.
        info_header: Информация за временната парола
        info_body_html: "<p>Временната парола е уникална поредица от цифри и букви, например:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Тази временна парола е само пример, за да видите как изглежда – тя не може да се използва.</em></p><p>Във входящата си поща ще намерите <strong>два имейла</strong>: имейла със защитеното съобщение и имейл с <strong>тема, която започва с: Временна парола</strong>. Вторият съдържа вашата уникална временна парола за тази система.</p><p>Ако не сте получили имейл с временна парола, възможно е вече да имате акаунт в тази система. В такъв случай щракнете върху „Вход“.</p><p>Ако смятате, че е трябвало да получите временна парола, но не сте, щракнете върху „Поискване на временна парола“, за да получите нова.</p>"
        email_address: Имейл адрес
        email_not_permitted: Този имейл адрес няма права да преглежда това защитено съобщение.
        email_not_permitted_description_html: <p>Проверете получения имейл със защитеното съобщение и въведете имейл адреса точно така, както е изпратено съобщението.</p><p>Например, ако имейл адресът ви може да бъде както ivan.petrov@firma.bg, така и ipetrov@firma.bg, системата няма как да знае, че това е един и същ адрес. Ако защитеното съобщение е изпратено до ivan.petrov@firma.bg, тук трябва да въведете именно този адрес.</p><p>Ако не сте сигурни, свържете се с подателя на защитеното съобщение.</p>
