        unauthenticated_html: <h4>Невалидно потребителско име или парола</h4><p>Въведете потребителското си име и парола. Можете да нулирате паролата си с бутона Нулиране на паролата по-долу.</p>
        unauthorized_to_view_check_email_html: <h4>Неупълномощен имейл адрес</h4><p>Проверете дали защитеното съобщение [<span class="font-monospace fw-bold">%{message_id}</span>] е изпратено до вас и въведете имейл адреса точно така, както е изпратено съобщението.</p><p>Например, ако имейл адресът ви може да бъде както ivan.petrov@firma.bg, така и ipetrov@firma.bg, системата няма как да знае, че това е един и същ адрес. Ако защитеното съобщение е изпратено до ivan.petrov@firma.bg, тук трябва да въведете именно този адрес.</p><p>Ако не сте сигурни, свържете се с подателя на защитеното съобщение.</p>
