      show:
        title: Zadejte prosím své dočasné heslo
        description_html: "Chystáte se zobrazit zabezpečenou zprávu. Chcete-li ji otevřít, musíte zadat dočasné heslo.<br>Dočasné heslo je jedinečný náhodný řetězec, který vás identifikuje. Dočasné heslo vám bylo zasláno v samostatném e-mailu (předmět: Dočasné heslo)."
        what_is_this: Co to je?
        login: Přihlásit se
        submit: Ověřit dočasné heslo
        submit_email: Odeslat
        if_you_have_account: "(pokud již máte účet)"
        request_temporary_user_header: Vyžádat nové dočasné heslo
        request_temporary_user_description_html: Pro přístup k této zprávě si můžete vyžádat nové dočasné heslo. Zadejte níže svou e-mailovou adresu a vyžádejte si nové dočasné heslo k této zabezpečené zprávě.
        info_header: Informace o dočasném hesle
        info_body_html: "<p>Dočasné heslo je jedinečná posloupnost číslic a písmen, například:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Toto dočasné heslo je pouze příklad, abyste viděli, jak vypadá – nelze jej použít.</em></p><p>Ve schránce najdete <strong>dva e-maily</strong>: e-mail se zabezpečenou zprávou a e-mail s <strong>předmětem začínajícím slovy: Dočasné heslo</strong>. Ten obsahuje vaše jedinečné dočasné heslo pro tento systém.</p><p>Pokud jste e-mail s dočasným heslem neobdrželi, možná již v tomto systému máte účet. V takovém případě klikněte na „Přihlásit se“.</p><p>Pokud si myslíte, že jste měli dočasné heslo obdržet, ale nestalo se tak, klikněte na „Vyžádat dočasné heslo“ a získejte nové.</p>"
        email_address: E-mailová adresa
        email_not_permitted: Tato e-mailová adresa nemá oprávnění zobrazit tuto zabezpečenou zprávu.
        email_not_permitted_description_html: <p>Zkontrolujte přijatý e-mail se zabezpečenou zprávou a zadejte e-mailovou adresu přesně tak, jak byla zpráva odeslána.</p><p>Pokud například vaše e-mailová adresa může být jan.novak@firma.cz i jnovak@firma.cz, systém nemůže vědět, že jde o stejnou adresu. Pokud byla zabezpečená zpráva odeslána na jan.novak@firma.cz, musíte zde zadat právě tuto adresu.</p><p>Pokud si nejste jisti, kontaktujte odesílatele zabezpečené zprávy.</p>
        email_can_login: V tomto systému již máte účet
        email_can_login_description_html: <p>Do tohoto systému se můžete přihlásit touto e-mailovou adresou a svým heslem.</p><p>Kliknutím na tlačítko Přihlásit se níže se přihlásíte svým stávajícím účtem.</p>
        temporary_user_delivered_header: Dočasné heslo odesláno
        temporary_user_delivered_description_html: <p>Na vaši e-mailovou adresu bylo odesláno dočasné heslo. Zkontrolujte doručenou poštu, zavřete toto okno a zadejte dočasné heslo.</p>
