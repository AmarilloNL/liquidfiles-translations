      email_message_on_top: Pokud je zaškrtnuto, zpráva je v e-mailu příjemcům umístěna nad seznamem souborů. Pokud není, je seznam souborů umístěn nad zprávou.
      email_sender: Tato e-mailová adresa bude použita jako odesílatel systémových e-mailů, například pro obnovení hesla. Aby nebyly tyto e-maily označeny jako spam, musí jít o skutečnou e-mailovou adresu.
      email_host: Přílohy budou tuto URL používat jako základní URL. Obvykle jde o http://nazevhostitele.domena nebo https://nazevhostitele.domena, ale může to být i https://nazevhostitele.domena:4433, pokud při připojování uživatelů k zařízení LiquidFiles používáte na firewallu přesměrování portů.
