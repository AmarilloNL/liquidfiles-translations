      delete_downloaded_files_after: Stažený soubor se uchovává po tuto dobu. Měla by být dost dlouhá na to, aby si příjemce mohl zvolit jiné umístění ke stažení nebo začít znovu, ale dost krátká, aby se odkaz nešířil dalším lidem.
      file_expiration: Povolí uživatelům měnit dobu platnosti souborů. Pokud není zapnuto, všechny soubory dostanou výchozí dobu platnosti.
      default_expire_files_after: Platnost souborů vyprší po této době.
      blocked_file_extensions: Blokovat soubory s těmito příponami (nerozlišují se malá a velká písmena).
      virus_scan: Kontrolovat všechny nahrané soubory antivirem ClamAV
      require_authentication_permission: Pokud je zapnuto, uživatelé si mohou sami zvolit, zda je vyžadováno ověření
      default_bcc_myself: Pokud je zapnuto, zprávy se ve výchozím nastavení posílají i samotnému uživateli
      permitted_file_extensions: "Pokud zůstane prázdné, jsou povoleny všechny přípony. Pokud je zadána alespoň jedna přípona, jsou povoleny pouze zadané typy souborů. Příklad: png, gif, jpg, txt"
