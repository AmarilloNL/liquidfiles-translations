        authenticate_description_html: Chystáte se zobrazit zabezpečenou zprávu. Nejprve se musíte přihlásit. Chcete-li pokračovat, zadejte svou e-mailovou adresu nebo se přihlaste.<br>Pokud v tomto systému nemáte účet, zadejte svou e-mailovou adresu a my vám pošleme zabezpečený odkaz k jejímu ověření.
        unauthenticated_html: <h4>Neplatné uživatelské jméno nebo heslo</h4><p>Zadejte své uživatelské jméno a heslo. Heslo můžete obnovit tlačítkem Obnovení hesla níže.</p>
        unauthorized_to_view_check_email_html: <h4>Neautorizovaná e-mailová adresa</h4><p>Zkontrolujte, zda vám byla zabezpečená zpráva [<span class="font-monospace fw-bold">%{message_id}</span>] odeslána, a zadejte e-mailovou adresu přesně tak, jak byla zpráva odeslána.</p><p>Pokud například vaše e-mailová adresa může být jan.novak@firma.cz i jnovak@firma.cz, systém nemůže vědět, že jde o stejnou adresu. Pokud byla zabezpečená zpráva odeslána na jan.novak@firma.cz, musíte zde zadat právě tuto adresu.</p><p>Pokud si nejste jisti, kontaktujte odesílatele zabezpečené zprávy.</p>
