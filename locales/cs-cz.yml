      local_domains: Místní uživatel může posílat soubory komukoli. Nemístní uživatel může posílat soubory pouze místním uživatelům. Při prvním přihlášení uživatele nebo při vytvoření účtu se doména e-mailové adresy porovná s těmito doménami a určí se, zda je uživatel považován za místního.
