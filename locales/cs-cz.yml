      windows_path_warning:
        title: Omezení délky cesty ve Windows
        description_html: <strong>Uživatelé Windows:</strong> Windows omezuje cesty k souborům na 259 znaků. Při nahrávání složek z umístění s dlouhými cestami mohou být soubory hluboko ve struktuře složek bez upozornění vynechány, což může vést k neúplnému nahrání nebo duplicitním složkám.
        workarounds_title: Doporučená řešení
        workarounds_html: "<li><strong>Použijte virtuální jednotku:</strong> otevřete příkazový řádek a spusťte: <code>subst X: \"C:\\vase\\dlouha\\cesta\\ke\\slozce\"</code><br>Poté nahrávejte z virtuální jednotky <code>X:\\</code></li><li><strong>Přejděte blíže k souborům:</strong> před výběrem složky k nahrání přejděte do podsložky blíže k souborům</li><li><strong>Použijte kratší cestu:</strong> před nahráním zkopírujte soubory do kratšího umístění, například <code>C:\\uploads\\</code></li><li><strong>Nejprve složku zabalte:</strong> zkomprimujte složku do souboru ZIP a nahrajte místo ní soubor ZIP</li>"
        advanced_title: "Pokročilé: zapnutí dlouhých cest ve Windows 10/11"
        advanced_description_html: Od Windows 10 verze 1607 můžete zapnout podporu delších cest. <strong>Poznámka:</strong> vyžaduje to oprávnění správce a nemusí to fungovat ve všech prohlížečích. Výše uvedená řešení jsou spolehlivější.
        registry_steps_title: Postup zapnutí dlouhých cest
        registry_steps_html: "<li>Stiskněte <kbd>Win + R</kbd>, napište <code>regedit</code> a stiskněte Enter</li><li>Přejděte na: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Najděte nebo vytvořte hodnotu DWORD s názvem <code>LongPathsEnabled</code> a nastavte ji na <code>1</code></li><li>Restartujte počítač, aby se změna projevila</li><li>Vyzkoušejte nahrávání znovu (podpora se může v jednotlivých prohlížečích lišit)</li>"
        browser_disclaimer_html: "<strong>Důležité:</strong> i se zapnutým tímto nastavením registru se podpora dlouhých cest v jednotlivých prohlížečích liší. Chrome, Edge a Firefox mohou limit 259 znaků stále uplatňovat. Výše uvedená řešení jsou spolehlivější."
