        authenticate_description_html: Du er ved at åbne en sikker besked. Du skal først logge ind. Indtast din e-mailadresse, eller log ind for at fortsætte.<br>Hvis du ikke har en konto på systemet, skal du indtaste din e-mailadresse, så sender vi et sikkert link til bekræftelse af din e-mailadresse.
        unauthenticated_html: <h4>Ugyldigt brugernavn eller adgangskode</h4><p>Indtast dit brugernavn og din adgangskode. Du kan nulstille din adgangskode med knappen Nulstil adgangskode nedenfor.</p>
        unauthorized_to_view_check_email_html: <h4>Uautoriseret e-mailadresse</h4><p>Kontrollér, at den sikre besked [<span class="font-monospace fw-bold">%{message_id}</span>] er sendt til dig, og indtast e-mailadressen præcis, som den blev brugt ved afsendelsen.</p><p>Hvis din e-mailadresse f.eks. både kan være jens.hansen@firma.dk og jhansen@firma.dk, kan systemet ikke vide, at det er den samme adresse. Hvis den sikre besked blev sendt til jens.hansen@firma.dk, er det den adresse, du skal indtaste her.</p><p>Hvis du er i tvivl, skal du kontakte afsenderen af den sikre besked.</p>
