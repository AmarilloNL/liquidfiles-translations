      show:
        title: Indtast din midlertidige adgangskode
        description_html: "Du er ved at åbne en sikker besked. For at åbne den skal du indtaste din midlertidige adgangskode.<br>En midlertidig adgangskode er en unik, tilfældig tegnstreng, der identificerer dig. Du har modtaget den midlertidige adgangskode i en separat e-mail (emne: Midlertidig adgangskode)."
