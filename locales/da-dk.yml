        description_html: <strong>Windows-brugere:</strong> Windows begrænser filstier til 259 tegn. Når du uploader mapper fra placeringer med lange stier, kan filer dybt nede i mappestrukturen blive udeladt uden varsel, hvilket kan give ufuldstændige uploads eller dublerede mapper.
        workarounds_title: Anbefalede løsninger
        workarounds_html: "<li><strong>Brug et virtuelt drev:</strong> Åbn kommandoprompten, og kør: <code>subst X: \"C:\\din\\lange\\sti\\til\\mappen\"</code><br>Upload derefter fra det virtuelle drev <code>X:\\</code></li><li><strong>Gå tættere på filerne:</strong> Gå til en undermappe tættere på dine filer, før du vælger den mappe, der skal uploades</li><li><strong>Brug en kortere sti:</strong> Kopiér dine filer til en kortere placering som <code>C:\\uploads\\</code>, før du uploader</li><li><strong>Zip mappen først:</strong> Komprimer mappen til en ZIP-fil, og upload i stedet ZIP-filen</li>"
        advanced_title: "Avanceret: Aktivér lange stier i Windows 10/11"
        advanced_description_html: Fra og med Windows 10 version 1607 kan du aktivere understøttelse af længere stier. <strong>Bemærk:</strong> Det kræver administratorrettigheder og virker muligvis ikke i alle browsere. Løsningerne ovenfor er mere pålidelige.
        registry_steps_title: Trin til aktivering af lange stier
        registry_steps_html: "<li>Tryk på <kbd>Win + R</kbd>, skriv <code>regedit</code>, og tryk på Enter</li><li>Gå til: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Find eller opret en DWORD-værdi med navnet <code>LongPathsEnabled</code>, og sæt den til <code>1</code></li><li>Genstart computeren, så ændringen træder i kraft</li><li>Test uploadet igen (understøttelsen kan variere fra browser til browser)</li>"
        browser_disclaimer_html: "<strong>Vigtigt:</strong> Selv med denne registreringsindstilling aktiveret varierer understøttelsen af lange stier fra browser til browser. Chrome, Edge og Firefox kan stadig håndhæve grænsen på 259 tegn. Løsningerne ovenfor er mere pålidelige."
