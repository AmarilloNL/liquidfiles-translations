        login: Log ind
        submit: Bekræft midlertidig adgangskode
        submit_email: Send
        if_you_have_account: "(hvis du allerede har en konto)"
        request_temporary_user_header: Anmod om ny midlertidig adgangskode
        request_temporary_user_description_html: Du kan anmode om en ny midlertidig adgangskode for at åbne beskeden. Indtast din e-mailadresse nedenfor for at anmode om en ny midlertidig adgangskode til denne sikre besked.
        info_header: Oplysninger om midlertidig adgangskode
        info_body_html: "<p>En midlertidig adgangskode er en unik række af tal og bogstaver, f.eks.:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Denne midlertidige adgangskode er kun et eksempel, så du kan se, hvordan den ser ud – den kan ikke bruges.</em></p><p>I din indbakke finder du <strong>to e-mails</strong>: en med den sikre besked og en med et <strong>emne, der begynder med: Midlertidig adgangskode</strong>. Den sidste indeholder din unikke midlertidige adgangskode til systemet.</p><p>Hvis du ikke har modtaget en e-mail med en midlertidig adgangskode, kan det skyldes, at du allerede har en konto på systemet. Klik i så fald på \"Log ind\".</p><p>Hvis du mener, at du burde have modtaget en midlertidig adgangskode, men ikke har, skal du klikke på \"Anmod om midlertidig adgangskode\" for at få en ny.</p>"
        email_address: E-mailadresse
        email_not_permitted: Denne e-mailadresse har ikke tilladelse til at se den sikre besked.
        email_not_permitted_description_html: <p>Kontrollér den e-mail med den sikre besked, du har modtaget, og indtast e-mailadressen præcis, som den blev brugt ved afsendelsen.</p><p>Hvis din e-mailadresse f.eks. både kan være jens.hansen@firma.dk og jhansen@firma.dk, kan systemet ikke vide, at det er den samme adresse. Hvis den sikre besked blev sendt til jens.hansen@firma.dk, er det den adresse, du skal indtaste her.</p><p>Hvis du er i tvivl, skal du kontakte afsenderen af den sikre besked.</p>
        email_can_login: Du har allerede en konto på systemet
        email_can_login_description_html: <p>Du kan logge ind på systemet med denne e-mailadresse og din adgangskode.</p><p>Klik på knappen Log ind nedenfor for at logge ind med din eksisterende konto.</p>
