        info_header: Informationen zum temporären Passwort
        info_body_html: "<p>Ein temporäres Passwort ist eine eindeutige Folge aus Ziffern und Buchstaben, zum Beispiel:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Dieses temporäre Passwort ist nur ein Beispiel, damit Sie sehen, wie es aussieht. Es kann nicht verwendet werden.</em></p><p>In Ihrem Posteingang finden Sie <strong>zwei E-Mails</strong>: die E-Mail mit der sicheren Nachricht und eine E-Mail mit einem <strong>Betreff, der beginnt mit: Temporäres Passwort</strong>. Diese E-Mail enthält Ihr eindeutiges temporäres Passwort für dieses System.</p><p>Wenn Sie keine E-Mail mit einem temporären Passwort erhalten haben, haben Sie möglicherweise bereits ein Konto auf diesem System. Klicken Sie in diesem Fall auf „Anmelden“.</p><p>Wenn Sie glauben, dass Sie ein temporäres Passwort hätten erhalten sollen, dies aber nicht der Fall ist, klicken Sie auf „Temporäres Passwort anfordern“, um ein neues zu erhalten.</p>"
