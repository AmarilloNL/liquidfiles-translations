        description_html: <strong>Windows-Benutzer:</strong> Windows begrenzt Dateipfade auf 259 Zeichen. Wenn Sie Ordner von Speicherorten mit langen Pfaden hochladen, werden Dateien tief in der Ordnerstruktur möglicherweise stillschweigend ausgelassen. Das kann zu unvollständigen Uploads oder doppelten Ordnern führen.
        workarounds_title: Empfohlene Lösungen
        workarounds_html: "<li><strong>Virtuelles Laufwerk verwenden:</strong> Öffnen Sie die Eingabeaufforderung und führen Sie aus: <code>subst X: \"C:\\Ihr\\langer\\Pfad\\zum\\Ordner\"</code><br>Laden Sie dann vom virtuellen Laufwerk <code>X:\\</code> hoch</li><li><strong>Näher zu den Dateien navigieren:</strong> Wechseln Sie in einen Unterordner näher an Ihren Dateien, bevor Sie den Upload-Ordner auswählen</li><li><strong>Kürzeren Pfad verwenden:</strong> Kopieren Sie Ihre Dateien vor dem Hochladen an einen kürzeren Speicherort wie <code>C:\\uploads\\</code></li><li><strong>Ordner zuerst zippen:</strong> Komprimieren Sie den Ordner in eine ZIP-Datei und laden Sie stattdessen die ZIP-Datei hoch</li>"
        advanced_title: "Erweitert: Lange Pfade unter Windows 10/11 aktivieren"
        advanced_description_html: Ab Windows 10 Version 1607 können Sie die Unterstützung für längere Pfade aktivieren. <strong>Hinweis:</strong> Dafür sind Administratorrechte erforderlich, und es funktioniert möglicherweise nicht in allen Browsern. Die oben genannten Lösungen sind zuverlässiger.
        registry_steps_title: Schritte zum Aktivieren langer Pfade
        registry_steps_html: "<li>Drücken Sie <kbd>Win + R</kbd>, geben Sie <code>regedit</code> ein und drücken Sie die Eingabetaste</li><li>Navigieren Sie zu: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Suchen oder erstellen Sie einen DWORD-Wert mit dem Namen <code>LongPathsEnabled</code> und setzen Sie ihn auf <code>1</code></li><li>Starten Sie Ihren Computer neu, damit die Änderung wirksam wird</li><li>Testen Sie den Upload erneut (die Unterstützung kann je nach Browser variieren)</li>"
        browser_disclaimer_html: "<strong>Wichtig:</strong> Auch mit dieser Registrierungseinstellung variiert die Unterstützung langer Pfade je nach Browser. Chrome, Edge und Firefox können die Grenze von 259 Zeichen weiterhin anwenden. Die oben genannten Lösungen sind zuverlässiger."
