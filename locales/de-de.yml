        email_not_permitted_description_html: <p>Bitte prüfen Sie die E-Mail mit der sicheren Nachricht, die Sie erhalten haben, und geben Sie die E-Mail-Adresse genau so ein, wie die Nachricht gesendet wurde.</p><p>Wenn Ihre E-Mail-Adresse zum Beispiel sowohl max.mustermann@firma.de als auch mmustermann@firma.de lautet, kann dieses System nicht wissen, dass es sich um dieselbe Adresse handelt. Wurde die sichere Nachricht an max.mustermann@firma.de gesendet, müssen Sie hier diese Adresse eingeben.</p><p>Wenn Sie unsicher sind, wenden Sie sich bitte an den Absender der sicheren Nachricht.</p>
