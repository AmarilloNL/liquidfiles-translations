    permission_description_anyone_after_authentication_html: <ul> <li>Οποιοσδήποτε έχει το μυστικό, τυχαίο URL μπορεί να κάνει λήψη των αρχείων.</li> <li>Το email ή το URL μπορεί να προωθηθεί σε οποιονδήποτε.</li> <li>Οι παραλήπτες πρέπει να συνδεθούν για να κάνουν λήψη των αρχείων.</li> <li>Σε κάθε λήψη κάθε αρχείου αποστέλλεται επιβεβαίωση λήψης με λεπτομερείς πληροφορίες.</li> </ul>
    permission_description_anyone_html: <ul> <li>Οποιοσδήποτε έχει το μυστικό, τυχαίο URL μπορεί να κάνει λήψη των αρχείων.</li> <li>Το email ή το URL μπορεί να προωθηθεί σε οποιονδήποτε.</li> <li>Η σύνδεση <strong>δεν</strong> απαιτείται για τη λήψη των αρχείων.</li> <li>Αποστέλλεται <strong>βασική</strong> επιβεβαίωση λήψης κατά την πρώτη λήψη από οποιονδήποτε (απαιτείται έλεγχος ταυτότητας για να είναι γνωστό ποιος κατέβασε τι).</li> </ul>
