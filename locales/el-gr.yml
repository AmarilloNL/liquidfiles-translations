        invalid_temporary_user: Μη έγκυρος κωδικός πρόσβασης. Ελέγξτε το email με τον προσωρινό κωδικό πρόσβασής σας ή ζητήστε νέο προσωρινό κωδικό πρόσβασης.
        temporary_user_expired: Αυτός ο προσωρινός κωδικός πρόσβασης έχει λήξει. Ένας νέος προσωρινός κωδικός πρόσβασης στάλθηκε στη διεύθυνση email σας. Ελέγξτε τα εισερχόμενά σας και χρησιμοποιήστε τον νέο προσωρινό κωδικό πρόσβασης.
        not_authorized_to_view_message: "Δεν έχετε εξουσιοδότηση να δείτε το μήνυμα με αναγνωριστικό: %{message_id}. Ελέγξτε ότι αυτό το μήνυμα στάλθηκε σε εσάς."
      show:
        title: Εισαγάγετε τον προσωρινό κωδικό πρόσβασής σας
        description_html: "Πρόκειται να δείτε ένα ασφαλές μήνυμα. Για να το ανοίξετε, πρέπει να εισαγάγετε τον προσωρινό κωδικό πρόσβασής σας.<br>Ο προσωρινός κωδικός πρόσβασης είναι μια μοναδική τυχαία συμβολοσειρά που σας ταυτοποιεί. Ο προσωρινός κωδικός πρόσβασης σας στάλθηκε σε ξεχωριστό email (θέμα: Προσωρινός κωδικός πρόσβασης)."
        what_is_this: Τι είναι αυτό;
        login: Σύνδεση
        submit: Επαλήθευση προσωρινού κωδικού πρόσβασης
        submit_email: Υποβολή
        if_you_have_account: "(αν έχετε ήδη λογαριασμό)"
        request_temporary_user_header: Αίτημα για νέο προσωρινό κωδικό πρόσβασης
        request_temporary_user_description_html: Μπορείτε να ζητήσετε νέο προσωρινό κωδικό πρόσβασης για να ανοίξετε αυτό το μήνυμα. Εισαγάγετε τη διεύθυνση email σας παρακάτω για να ζητήσετε νέο προσωρινό κωδικό πρόσβασης για αυτό το ασφαλές μήνυμα.
        info_header: Πληροφορίες για τον προσωρινό κωδικό πρόσβασης
        info_body_html: "<p>Ο προσωρινός κωδικός πρόσβασης είναι μια μοναδική σειρά αριθμών και γραμμάτων, για παράδειγμα:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Αυτός ο προσωρινός κωδικός πρόσβασης είναι μόνο παράδειγμα για να δείτε πώς μοιάζει – δεν μπορεί να χρησιμοποιηθεί.</em></p><p>Στα εισερχόμενά σας θα βρείτε <strong>δύο email</strong>: αυτό με το ασφαλές μήνυμα και ένα με <strong>θέμα που ξεκινά με: Προσωρινός κωδικός πρόσβασης</strong>. Το δεύτερο περιέχει τον μοναδικό προσωρινό κωδικό πρόσβασής σας για αυτό το σύστημα.</p><p>Αν δεν έχετε λάβει email με προσωρινό κωδικό πρόσβασης, ίσως έχετε ήδη λογαριασμό σε αυτό το σύστημα. Σε αυτή την περίπτωση, κάντε κλικ στη «Σύνδεση».</p><p>Αν πιστεύετε ότι έπρεπε να λάβετε προσωρινό κωδικό πρόσβασης αλλά δεν τον λάβατε, κάντε κλικ στο «Αίτημα προσωρινού κωδικού πρόσβασης» για να λάβετε νέο.</p>"
        email_address: Διεύθυνση email
        email_not_permitted: Αυτή η διεύθυνση email δεν έχει δικαίωμα να δει αυτό το ασφαλές μήνυμα.
        email_not_permitted_description_html: <p>Ελέγξτε το email με το ασφαλές μήνυμα που λάβατε και εισαγάγετε τη διεύθυνση email ακριβώς όπως στάλθηκε το μήνυμα.</p><p>Για παράδειγμα, αν η διεύθυνσή σας μπορεί να είναι τόσο giorgos.papadopoulos@etaireia.gr όσο και gpapadopoulos@etaireia.gr, το σύστημα δεν μπορεί να γνωρίζει ότι πρόκειται για την ίδια διεύθυνση. Αν το ασφαλές μήνυμα στάλθηκε στη giorgos.papadopoulos@etaireia.gr, αυτή είναι η διεύθυνση που πρέπει να εισαγάγετε εδώ.</p><p>Αν δεν είστε σίγουροι, επικοινωνήστε με τον αποστολέα του ασφαλούς μηνύματος.</p>
        email_can_login: Έχετε ήδη λογαριασμό σε αυτό το σύστημα
        email_can_login_description_html: <p>Μπορείτε να συνδεθείτε σε αυτό το σύστημα με αυτή τη διεύθυνση email και τον κωδικό πρόσβασής σας.</p><p>Κάντε κλικ στο κουμπί Σύνδεση παρακάτω για να συνδεθείτε με τον υπάρχοντα λογαριασμό σας.</p>
        temporary_user_delivered_header: Ο προσωρινός κωδικός πρόσβασης στάλθηκε
        temporary_user_delivered_description_html: <p>Ένας προσωρινός κωδικός πρόσβασης στάλθηκε στη διεύθυνση email σας. Ελέγξτε τα εισερχόμενά σας, κλείστε αυτό το παράθυρο και εισαγάγετε τον προσωρινό κωδικό πρόσβασης.</p>
