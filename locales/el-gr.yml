      windows_path_warning:
        title: Περιορισμός μήκους διαδρομής στα Windows
        description_html: <strong>Χρήστες Windows:</strong> τα Windows περιορίζουν τις διαδρομές αρχείων σε 259 χαρακτήρες. Κατά την αποστολή φακέλων από θέσεις με μεγάλες διαδρομές, αρχεία που βρίσκονται βαθιά στη δομή φακέλων ενδέχεται να παραλειφθούν χωρίς προειδοποίηση, με αποτέλεσμα ελλιπείς αποστολές ή διπλότυπους φακέλους.
        workarounds_title: Προτεινόμενες λύσεις
        workarounds_html: "<li><strong>Χρησιμοποιήστε εικονική μονάδα δίσκου:</strong> ανοίξτε τη Γραμμή εντολών και εκτελέστε: <code>subst X: \"C:\\i\\megali\\diadromi\\pros\\fakelo\"</code><br>Στη συνέχεια κάντε αποστολή από την εικονική μονάδα <code>X:\\</code></li><li><strong>Μεταβείτε πιο κοντά στα αρχεία:</strong> ανοίξτε έναν υποφάκελο πιο κοντά στα αρχεία σας πριν επιλέξετε τον φάκελο αποστολής</li><li><strong>Χρησιμοποιήστε συντομότερη διαδρομή:</strong> αντιγράψτε τα αρχεία σας σε μια συντομότερη θέση, όπως <code>C:\\uploads\\</code>, πριν από την αποστολή</li><li><strong>Συμπιέστε πρώτα τον φάκελο:</strong> συμπιέστε τον φάκελο σε αρχείο ZIP και στείλτε αντί αυτού το αρχείο ZIP</li>"
        advanced_title: "Για προχωρημένους: ενεργοποίηση μεγάλων διαδρομών στα Windows 10/11"
        advanced_description_html: Από τα Windows 10 έκδοση 1607 και μετά, μπορείτε να ενεργοποιήσετε την υποστήριξη μεγαλύτερων διαδρομών. <strong>Σημείωση:</strong> απαιτούνται δικαιώματα διαχειριστή και ενδέχεται να μη λειτουργεί σε όλα τα προγράμματα περιήγησης. Οι παραπάνω λύσεις είναι πιο αξιόπιστες.
        registry_steps_title: Βήματα για την ενεργοποίηση μεγάλων διαδρομών
        registry_steps_html: "<li>Πατήστε <kbd>Win + R</kbd>, πληκτρολογήστε <code>regedit</code> και πατήστε Enter</li><li>Μεταβείτε στο: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Βρείτε ή δημιουργήστε μια τιμή DWORD με όνομα <code>LongPathsEnabled</code> και ορίστε την σε <code>1</code></li><li>Επανεκκινήστε τον υπολογιστή για να τεθεί σε ισχύ η αλλαγή</li><li>Δοκιμάστε ξανά την αποστολή (η υποστήριξη μπορεί να διαφέρει ανάλογα με το πρόγραμμα περιήγησης)</li>"
        browser_disclaimer_html: "<strong>Σημαντικό:</strong> ακόμη και με αυτή τη ρύθμιση μητρώου ενεργοποιημένη, η υποστήριξη μεγάλων διαδρομών διαφέρει ανάλογα με το πρόγραμμα περιήγησης. Τα Chrome, Edge και Firefox ενδέχεται να εξακολουθούν να επιβάλλουν το όριο των 259 χαρακτήρων. Οι παραπάνω λύσεις είναι πιο αξιόπιστες."
