    geoip_description: Λαμβάνει δεδομένα γεωγραφικής θέσης από το https://geoip.liquidfiles.com και εμφανίζει χάρτες.
    tooltip:
      local_domains: Ένας τοπικός χρήστης μπορεί να στέλνει αρχεία σε οποιονδήποτε. Ένας μη τοπικός χρήστης μπορεί να στέλνει αρχεία μόνο σε τοπικούς χρήστες. Την πρώτη φορά που συνδέεται ένας χρήστης ή όταν δημιουργείται ο λογαριασμός, ο τομέας της διεύθυνσης email συγκρίνεται με αυτούς τους τομείς για να καθοριστεί αν ο χρήστης θεωρείται τοπικός.
      ldap_users_are_always_local: Κάθε χρήστης που ελέγχεται μέσω LDAP θεωρείται αυτόματα τοπικός, ανεξάρτητα από τον τομέα.
      allow_registration: Επιτρέπει την εγγραφή από τη σελίδα σύνδεσης. Με βάση τη λίστα τοπικών τομέων καθορίζεται αν ένας νέος χρήστης είναι τοπικός ή μη τοπικός.
      local_user_maxfile: Όταν ένας τοπικός χρήστης εγγράφεται ή ελέγχεται για πρώτη φορά μέσω απομακρυσμένου ελέγχου ταυτότητας, του ορίζεται αυτό το μέγιστο μέγεθος αρχείου.
      nonlocal_user_maxfile: Όταν ένας μη τοπικός χρήστης εγγράφεται, του ορίζεται αυτό το μέγιστο μέγεθος αρχείου.
      delete_downloaded_files_after: Ένα αρχείο που έχει ληφθεί διατηρείται για αυτό το διάστημα. Πρέπει να είναι αρκετά μεγάλο ώστε ο παραλήπτης να μπορεί να επιλέξει άλλη θέση λήψης ή να ξεκινήσει από την αρχή, αλλά αρκετά μικρό ώστε ο σύνδεσμος να μη διαδοθεί σε περισσότερα άτομα.
      file_expiration: Επιτρέπει στους χρήστες να αλλάζουν τον χρόνο λήξης των αρχείων. Αν δεν είναι ενεργοποιημένο, όλα τα αρχεία λαμβάνουν τον προεπιλεγμένο χρόνο λήξης.
      default_expire_files_after: Τα αρχεία θα λήξουν μετά από αυτό το διάστημα.
      blocked_file_extensions: Αποκλεισμός αρχείων με αυτές τις επεκτάσεις (χωρίς διάκριση πεζών-κεφαλαίων).
      virus_scan: Σάρωση όλων των αρχείων που αποστέλλονται για ιούς με το πρόγραμμα προστασίας ClamAV
      require_authentication_permission: Όταν είναι ενεργοποιημένο, οι χρήστες μπορούν να επιλέγουν οι ίδιοι αν απαιτείται έλεγχος ταυτότητας
      default_bcc_myself: Όταν είναι ενεργοποιημένο, τα μηνύματα στέλνονται από προεπιλογή και στον ίδιο τον χρήστη
      permitted_file_extensions: "Αν μείνει κενό, επιτρέπονται όλες οι επεκτάσεις. Αν εισαχθεί τουλάχιστον μία επέκταση, επιτρέπονται μόνο οι τύποι αρχείων που εισήχθησαν. Παράδειγμα: png, gif, jpg, txt"
      new_external_recipient_is_nonlocal: Όταν ένα μήνυμα στέλνεται σε νέο παραλήπτη, πρέπει να δημιουργηθεί ως μη τοπικός χρήστης (ώστε να μπορεί να απαντήσει) ή ως εξωτερικός χρήστης;
      email_message_on_top: Όταν είναι επιλεγμένο, το μήνυμα εμφανίζεται πάνω από τη λίστα αρχείων στο email προς τους παραλήπτες. Όταν δεν είναι, η λίστα αρχείων εμφανίζεται πάνω από το μήνυμα.
      email_sender: Αυτή η διεύθυνση email θα χρησιμοποιείται ως αποστολέας για τα email που δημιουργεί το σύστημα, όπως η επαναφορά κωδικού πρόσβασης. Για να μη χαρακτηρίζονται αυτά τα email ως ανεπιθύμητα, πρέπει να είναι πραγματική διεύθυνση email.
      email_host: Τα συνημμένα θα χρησιμοποιούν αυτό το URL ως βασικό URL. Κανονικά είναι http://onoma-host.domain ή https://onoma-host.domain, αλλά μπορεί να είναι και https://onoma-host.domain:4433 αν χρησιμοποιείτε προώθηση θυρών στο τείχος προστασίας όταν οι χρήστες συνδέονται στη συσκευή LiquidFiles.
      email_footer: Αυτή η υπογραφή θα προστίθεται σε όλα τα εξερχόμενα email.
