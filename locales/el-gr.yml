    permission_description_only_specified_html: <ul> <li>Μόνο οι καθορισμένοι παραλήπτες έχουν πρόσβαση στο μήνυμα και μπορούν να κάνουν λήψη των αρχείων.</li> <li>Η προώθηση του email ή του URL σε οποιονδήποτε δεν επιτρέπεται.</li> <li>Οι παραλήπτες πρέπει να συνδεθούν για να ανοίξουν το μήνυμα και να κάνουν λήψη των αρχείων.</li> <li>Σε κάθε λήψη κάθε αρχείου αποστέλλεται επιβεβαίωση λήψης με λεπτομερείς πληροφορίες.</li> </ul>
