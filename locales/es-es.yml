        info_body_html: "<p>Una contraseña temporal es una secuencia única de números y letras, por ejemplo:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Esta contraseña temporal es solo un ejemplo para que vea su aspecto; no se puede utilizar.</em></p><p>En su bandeja de entrada encontrará <strong>dos correos</strong>: el del mensaje seguro y otro con un <strong>asunto que empieza por: Contraseña temporal</strong>. Ese correo contiene su contraseña temporal única para este sistema.</p><p>Si no ha recibido ningún correo con una contraseña temporal, puede que ya tenga una cuenta en este sistema. En ese caso, haga clic en «Iniciar sesión».</p><p>Si cree que debería haber recibido una contraseña temporal pero no ha sido así, haga clic en «Solicitar contraseña temporal» para obtener una nueva.</p>"
        email_address: Dirección de correo electrónico
        email_not_permitted: Esta dirección de correo electrónico no tiene permiso para ver este mensaje seguro.
        email_not_permitted_description_html: <p>Revise el correo del mensaje seguro que ha recibido e introduzca la dirección de correo electrónico exactamente como se envió.</p><p>Por ejemplo, si su dirección puede ser tanto juan.garcia@empresa.es como jgarcia@empresa.es, este sistema no tiene forma de saber que son la misma. Si el mensaje seguro se envió a juan.garcia@empresa.es, esa es la dirección que debe introducir aquí.</p><p>Si tiene dudas, póngase en contacto con el remitente del mensaje seguro.</p>
        email_can_login: Ya tiene una cuenta en este sistema
        email_can_login_description_html: <p>Puede iniciar sesión en este sistema con esta dirección de correo electrónico y su contraseña.</p><p>Haga clic en el botón Iniciar sesión de abajo para entrar con su cuenta existente.</p>
