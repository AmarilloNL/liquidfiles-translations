      windows_path_warning:
        title: Limitación de longitud de rutas en Windows
        description_html: <strong>Usuarios de Windows:</strong> Windows limita las rutas de archivo a 259 caracteres. Al subir carpetas desde ubicaciones con rutas largas, es posible que los archivos situados en niveles profundos de la estructura se omitan sin aviso, lo que puede provocar subidas incompletas o carpetas duplicadas.
        workarounds_title: Soluciones recomendadas
        workarounds_html: "<li><strong>Usar una unidad virtual:</strong> abra el símbolo del sistema y ejecute: <code>subst X: \"C:\\su\\ruta\\larga\\a\\la\\carpeta\"</code><br>Después suba desde la unidad virtual <code>X:\\</code></li><li><strong>Acercarse a los archivos:</strong> navegue a una subcarpeta más cercana a sus archivos antes de seleccionar la carpeta que desea subir</li><li><strong>Usar una ruta más corta:</strong> copie sus archivos a una ubicación más corta como <code>C:\\uploads\\</code> antes de subirlos</li><li><strong>Comprimir primero la carpeta:</strong> comprima la carpeta en un archivo ZIP y suba ese archivo ZIP en su lugar</li>"
        advanced_title: "Avanzado: activar rutas largas en Windows 10/11"
        advanced_description_html: A partir de Windows 10 versión 1607, puede activar la compatibilidad con rutas más largas. <strong>Nota:</strong> requiere privilegios de administrador y puede que no funcione en todos los navegadores. Las soluciones anteriores son más fiables.
        registry_steps_title: Pasos para activar las rutas largas
        registry_steps_html: "<li>Pulse <kbd>Win + R</kbd>, escriba <code>regedit</code> y pulse Intro</li><li>Vaya a: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Busque o cree un valor DWORD llamado <code>LongPathsEnabled</code> y establézcalo en <code>1</code></li><li>Reinicie el equipo para que el cambio surta efecto</li><li>Vuelva a probar la subida (la compatibilidad puede variar según el navegador)</li>"
        browser_disclaimer_html: "<strong>Importante:</strong> incluso con esta opción del registro activada, la compatibilidad con rutas largas varía según el navegador. Chrome, Edge y Firefox pueden seguir aplicando el límite de 259 caracteres. Las soluciones anteriores son más fiables."
