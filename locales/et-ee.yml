        info_body_html: "<p>Ajutine parool on unikaalne numbrite ja tähtede jada, näiteks:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>See ajutine parool on ainult näide, et näeksid, kuidas see välja näeb – seda ei saa kasutada.</em></p><p>Oma postkastist leiad <strong>kaks e-kirja</strong>: turvalise sõnumiga e-kirja ja e-kirja, mille <strong>teema algab sõnadega: Ajutine parool</strong>. Viimane sisaldab sinu unikaalset ajutist parooli selle süsteemi jaoks.</p><p>Kui sa pole ajutise parooliga e-kirja saanud, võib sul juba olla selles süsteemis konto. Sel juhul klõpsa „Logi sisse“.</p><p>Kui arvad, et oleksid pidanud ajutise parooli saama, kuid pole seda saanud, klõpsa uue saamiseks „Taotle ajutist parooli“.</p>"
