        registry_steps_title: Pikkade teede lubamise sammud
        registry_steps_html: "<li>Vajuta <kbd>Win + R</kbd>, tipi <code>regedit</code> ja vajuta Enter</li><li>Liigu asukohta: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Leia või loo DWORD-väärtus nimega <code>LongPathsEnabled</code> ja määra selle väärtuseks <code>1</code></li><li>Muudatuse jõustumiseks taaskäivita arvuti</li><li>Proovi üleslaadimist uuesti (tugi võib brauseriti erineda)</li>"
