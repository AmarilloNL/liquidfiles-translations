        workarounds_title: Soovitatavad lahendused
        workarounds_html: "<li><strong>Kasuta virtuaalset draivi:</strong> ava käsuviip ja käivita: <code>subst X: \"C:\\sinu\\pikk\\tee\\kaustani\"</code><br>Seejärel laadi üles virtuaalselt draivilt <code>X:\\</code></li><li><strong>Liigu failidele lähemale:</strong> sirvi enne üleslaaditava kausta valimist failidele lähemal asuvasse alamkausta</li><li><strong>Kasuta lühemat teed:</strong> kopeeri failid enne üleslaadimist lühemasse asukohta, näiteks <code>C:\\uploads\\</code></li><li><strong>Paki kaust kõigepealt kokku:</strong> tihenda kaust ZIP-failiks ja laadi selle asemel üles ZIP-fail</li>"
