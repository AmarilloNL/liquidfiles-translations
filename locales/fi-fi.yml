      show:
        title: Anna tilapäinen salasanasi
        description_html: "Olet avaamassa suojattua viestiä. Avataksesi viestin sinun on annettava tilapäinen salasanasi.<br>Tilapäinen salasana on yksilöllinen, satunnainen merkkijono, joka tunnistaa sinut. Tilapäinen salasana on lähetetty sinulle erillisessä sähköpostissa (aihe: Tilapäinen salasana)."
        what_is_this: Mikä tämä on?
        login: Kirjaudu sisään
        submit: Tarkista tilapäinen salasana
        submit_email: Lähetä
        if_you_have_account: "(jos sinulla on jo tili)"
        request_temporary_user_header: Pyydä uusi tilapäinen salasana
        request_temporary_user_description_html: Voit pyytää uuden tilapäisen salasanan tämän viestin avaamiseksi. Anna sähköpostiosoitteesi alle pyytääksesi uuden tilapäisen salasanan tätä suojattua viestiä varten.
        info_header: Tietoja tilapäisestä salasanasta
        info_body_html: "<p>Tilapäinen salasana on yksilöllinen numeroiden ja kirjainten sarja, esimerkiksi:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Tämä tilapäinen salasana on vain esimerkki, jotta näet, miltä se näyttää – sitä ei voi käyttää.</em></p><p>Saapuneista löydät <strong>kaksi sähköpostia</strong>: suojatun viestin sisältävän viestin ja viestin, jonka <strong>aihe alkaa sanoilla: Tilapäinen salasana</strong>. Jälkimmäisessä on yksilöllinen tilapäinen salasanasi tähän järjestelmään.</p><p>Jos et ole saanut sähköpostia, jossa on tilapäinen salasana, sinulla saattaa jo olla tili järjestelmässä. Napsauta tällöin ”Kirjaudu sisään”.</p><p>Jos uskot, että sinun olisi pitänyt saada tilapäinen salasana mutta et ole saanut sitä, napsauta ”Pyydä tilapäinen salasana” saadaksesi uuden.</p>"
        email_address: Sähköpostiosoite
        email_not_permitted: Tällä sähköpostiosoitteella ei ole oikeutta tarkastella tätä suojattua viestiä.
        email_not_permitted_description_html: <p>Tarkista saamasi suojatun viestin sähköposti ja anna sähköpostiosoite täsmälleen siinä muodossa kuin viesti lähetettiin.</p><p>Jos sähköpostiosoitteesi voi olla esimerkiksi sekä matti.virtanen@yritys.fi että mvirtanen@yritys.fi, järjestelmä ei voi tietää, että ne ovat sama osoite. Jos suojattu viesti lähetettiin osoitteeseen matti.virtanen@yritys.fi, sinun on annettava tässä juuri se osoite.</p><p>Jos olet epävarma, ota yhteyttä suojatun viestin lähettäjään.</p>
        email_can_login: Sinulla on jo tili järjestelmässä
        email_can_login_description_html: <p>Voit kirjautua järjestelmään tällä sähköpostiosoitteella ja salasanallasi.</p><p>Napsauta alla olevaa Kirjaudu sisään -painiketta kirjautuaksesi nykyisellä tililläsi.</p>
        temporary_user_delivered_header: Tilapäinen salasana lähetetty
