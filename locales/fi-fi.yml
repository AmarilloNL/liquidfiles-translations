        title: Windowsin polun pituusrajoitus
        description_html: <strong>Windows-käyttäjät:</strong> Windows rajoittaa tiedostopolut 259 merkkiin. Kun lataat kansioita sijainneista, joiden polut ovat pitkiä, syvällä kansiorakenteessa olevat tiedostot saatetaan jättää pois huomaamatta, mikä voi johtaa keskeneräisiin latauksiin tai kansioiden kaksoiskappaleisiin.
        workarounds_title: Suositellut ratkaisut
        workarounds_html: "<li><strong>Käytä virtuaaliasemaa:</strong> avaa komentokehote ja suorita: <code>subst X: \"C:\\pitka\\polku\\kansioon\"</code><br>Lataa sen jälkeen virtuaaliasemalta <code>X:\\</code></li><li><strong>Siirry lähemmäs tiedostoja:</strong> selaa tiedostoja lähempänä olevaan alikansioon ennen ladattavan kansion valitsemista</li><li><strong>Käytä lyhyempää polkua:</strong> kopioi tiedostot lyhyempään sijaintiin, kuten <code>C:\\uploads\\</code>, ennen lataamista</li><li><strong>Pakkaa kansio ensin:</strong> pakkaa kansio ZIP-tiedostoksi ja lataa ZIP-tiedosto sen sijaan</li>"
        advanced_title: "Edistynyt: ota pitkät polut käyttöön Windows 10/11:ssä"
        advanced_description_html: Windows 10:n versiosta 1607 alkaen voit ottaa pidempien polkujen tuen käyttöön. <strong>Huomaa:</strong> tämä edellyttää järjestelmänvalvojan oikeuksia, eikä se välttämättä toimi kaikissa selaimissa. Yllä olevat ratkaisut ovat luotettavampia.
        registry_steps_title: Pitkien polkujen käyttöönoton vaiheet
        registry_steps_html: "<li>Paina <kbd>Win + R</kbd>, kirjoita <code>regedit</code> ja paina Enter</li><li>Siirry kohtaan: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Etsi tai luo DWORD-arvo nimeltä <code>LongPathsEnabled</code> ja aseta sen arvoksi <code>1</code></li><li>Käynnistä tietokone uudelleen, jotta muutos tulee voimaan</li><li>Kokeile latausta uudelleen (tuki voi vaihdella selaimittain)</li>"
        browser_disclaimer_html: "<strong>Tärkeää:</strong> vaikka tämä rekisteriasetus olisi käytössä, pitkien polkujen tuki vaihtelee selaimittain. Chrome, Edge ja Firefox saattavat edelleen soveltaa 259 merkin rajaa. Yllä olevat ratkaisut ovat luotettavampia."
