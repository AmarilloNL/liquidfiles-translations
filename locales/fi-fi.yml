        unauthenticated_html: <h4>Virheellinen käyttäjätunnus tai salasana</h4><p>Anna käyttäjätunnuksesi ja salasanasi. Voit palauttaa salasanasi alla olevalla Salasanan palautus -painikkeella.</p>
        unauthorized_to_view_check_email_html: <h4>Luvaton sähköpostiosoite</h4><p>Tarkista, että suojattu viesti [<span class="font-monospace fw-bold">%{message_id}</span>] on lähetetty sinulle, ja anna sähköpostiosoite täsmälleen siinä muodossa kuin viesti lähetettiin.</p><p>Jos sähköpostiosoitteesi voi olla esimerkiksi sekä matti.virtanen@yritys.fi että mvirtanen@yritys.fi, järjestelmä ei voi tietää, että ne ovat sama osoite. Jos suojattu viesti lähetettiin osoitteeseen matti.virtanen@yritys.fi, sinun on annettava tässä juuri se osoite.</p><p>Jos olet epävarma, ota yhteyttä suojatun viestin lähettäjään.</p>
