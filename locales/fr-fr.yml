      windows_path_warning:
        title: Limite de longueur des chemins sous Windows
        description_html: <strong>Utilisateurs Windows :</strong> Windows limite les chemins de fichiers à 259 caractères. Lors de l'envoi de dossiers depuis des emplacements aux chemins longs, les fichiers situés en profondeur dans l'arborescence peuvent être ignorés sans avertissement, ce qui peut entraîner des envois incomplets ou des dossiers en double.
        workarounds_title: Solutions recommandées
        workarounds_html: "<li><strong>Utiliser un lecteur virtuel :</strong> ouvrez l'invite de commandes et exécutez : <code>subst X: \"C:\\votre\\long\\chemin\\vers\\dossier\"</code><br>Envoyez ensuite depuis le lecteur virtuel <code>X:\\</code></li><li><strong>Se rapprocher des fichiers :</strong> parcourez un sous-dossier plus proche de vos fichiers avant de sélectionner le dossier à envoyer</li><li><strong>Utiliser un chemin plus court :</strong> copiez vos fichiers vers un emplacement plus court comme <code>C:\\uploads\\</code> avant l'envoi</li><li><strong>Compresser d'abord le dossier :</strong> compressez le dossier en fichier ZIP, puis envoyez plutôt le fichier ZIP</li>"
        advanced_title: "Avancé : activer les chemins longs sous Windows 10/11"
        advanced_description_html: Depuis Windows 10 version 1607, vous pouvez activer la prise en charge des chemins plus longs. <strong>Remarque :</strong> cela nécessite des droits d'administrateur et peut ne pas fonctionner dans tous les navigateurs. Les solutions ci-dessus sont plus fiables.
        registry_steps_title: Étapes pour activer les chemins longs
        registry_steps_html: "<li>Appuyez sur <kbd>Win + R</kbd>, tapez <code>regedit</code> et appuyez sur Entrée</li><li>Accédez à : <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Recherchez ou créez une valeur DWORD nommée <code>LongPathsEnabled</code> et définissez-la sur <code>1</code></li><li>Redémarrez votre ordinateur pour que la modification prenne effet</li><li>Testez à nouveau l'envoi (la prise en charge peut varier selon le navigateur)</li>"
        browser_disclaimer_html: "<strong>Important :</strong> même avec ce paramètre de registre activé, la prise en charge des chemins longs varie selon les navigateurs. Chrome, Edge et Firefox peuvent toujours appliquer la limite de 259 caractères. Les solutions ci-dessus sont plus fiables."
