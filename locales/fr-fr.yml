        description_html: "Vous êtes sur le point de consulter un message sécurisé. Pour y accéder, vous devez saisir votre mot de passe temporaire.<br>Un mot de passe temporaire est une chaîne unique et aléatoire qui vous identifie. Il vous a été envoyé dans un e-mail séparé (objet : Mot de passe temporaire)."
        what_is_this: Qu'est-ce que c'est ?
        login: Se connecter
        submit: Vérifier le mot de passe temporaire
        submit_email: Envoyer
        if_you_have_account: "(si vous avez déjà un compte)"
        request_temporary_user_header: Demander un nouveau mot de passe temporaire
        request_temporary_user_description_html: Vous pouvez demander un nouveau mot de passe temporaire pour accéder à ce message. Veuillez saisir votre adresse e-mail ci-dessous pour demander un nouveau mot de passe temporaire pour ce message sécurisé.
        info_header: Informations sur le mot de passe temporaire
        info_body_html: "<p>Un mot de passe temporaire est une suite unique de chiffres et de lettres, par exemple :</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Ce mot de passe temporaire n'est qu'un exemple pour vous montrer à quoi il ressemble ; il n'est pas utilisable.</em></p><p>Dans votre boîte de réception, vous trouverez <strong>deux e-mails</strong> : l'e-mail du message sécurisé et un e-mail dont <strong>l'objet commence par : Mot de passe temporaire</strong>. Ce dernier contient votre mot de passe temporaire unique pour ce système.</p><p>Si vous n'avez pas reçu d'e-mail avec un mot de passe temporaire, c'est peut-être parce que vous avez déjà un compte sur ce système. Dans ce cas, cliquez sur « Se connecter ».</p><p>Si vous pensez que vous auriez dû recevoir un mot de passe temporaire mais que ce n'est pas le cas, cliquez sur « Demander un mot de passe temporaire » pour en obtenir un nouveau.</p>"
        email_address: Adresse e-mail
        email_not_permitted: Cette adresse e-mail n'est pas autorisée à consulter ce message sécurisé.
        email_not_permitted_description_html: <p>Veuillez vérifier l'e-mail du message sécurisé que vous avez reçu et saisissez l'adresse e-mail exactement telle qu'elle a été utilisée pour l'envoi.</p><p>Par exemple, si votre adresse peut être aussi bien jean.dupont@entreprise.fr que jdupont@entreprise.fr, ce système n'a aucun moyen de savoir qu'il s'agit de la même personne. Si le message sécurisé a été envoyé à jean.dupont@entreprise.fr, c'est cette adresse que vous devez saisir ici.</p><p>En cas de doute, veuillez contacter l'expéditeur du message sécurisé.</p>
        email_can_login: Vous avez déjà un compte sur ce système
        email_can_login_description_html: <p>Vous pouvez vous connecter à ce système avec cette adresse e-mail et votre mot de passe.</p><p>Cliquez sur le bouton Se connecter ci-dessous pour vous connecter avec votre compte existant.</p>
        temporary_user_delivered_header: Mot de passe temporaire envoyé
        temporary_user_delivered_description_html: <p>Un mot de passe temporaire a été envoyé à votre adresse e-mail. Veuillez consulter votre boîte de réception, fermer cette fenêtre et saisir le mot de passe temporaire.</p>
