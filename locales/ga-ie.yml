    authorize:
      show:
        title: Logáil isteach chun an teachtaireacht shlán a oscailt
        authenticate_description_html: Tá tú ar tí teachtaireacht shlán a fheiceáil. Caithfidh tú logáil isteach ar dtús. Cuir isteach do sheoladh ríomhphoist nó logáil isteach le leanúint ar aghaidh.<br>Mura bhfuil cuntas agat ar an gcóras seo, cuir isteach do sheoladh ríomhphoist agus seolfaimid nasc slán chugat chun é a dheimhniú.
        unauthenticated_html: <h4>Ainm úsáideora nó pasfhocal neamhbhailí</h4><p>Cuir isteach d'ainm úsáideora agus do phasfhocal. Is féidir leat do phasfhocal a athshocrú leis an gcnaipe Athshocraigh an pasfhocal thíos.</p>
        unauthorized_to_view_check_email_html: <h4>Seoladh ríomhphoist gan údarú</h4><p>Seiceáil gur seoladh an teachtaireacht shlán [<span class="font-monospace fw-bold">%{message_id}</span>] chugat agus cuir isteach an seoladh ríomhphoist díreach mar a seoladh an teachtaireacht.</p><p>Mar shampla, más féidir le do sheoladh a bheith sean.omurchu@comhlacht.ie agus somurchu@comhlacht.ie araon, níl a fhios ag an gcóras gurb é an seoladh céanna é. Má seoladh an teachtaireacht shlán chuig sean.omurchu@comhlacht.ie, is é sin an seoladh ba chóir duit a chur isteach anseo.</p><p>Mura bhfuil tú cinnte, déan teagmháil le seoltóir na teachtaireachta sláine.</p>
