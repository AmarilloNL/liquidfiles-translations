        temporary_user_expired: Tá an pasfhocal sealadach seo imithe in éag. Seoladh pasfhocal sealadach nua chuig do sheoladh ríomhphoist. Seiceáil do bhosca isteach agus bain úsáid as an bpasfhocal sealadach nua.
