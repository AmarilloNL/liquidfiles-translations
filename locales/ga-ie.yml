      windows_path_warning:
        title: Teorainn ar fhad cosáin in Windows
        description_html: <strong>Úsáideoirí Windows:</strong> teorannaíonn Windows cosáin chomhaid go 259 carachtar. Nuair a uaslódáiltear fillteáin ó áiteanna le cosáin fhada, d'fhéadfaí comhaid atá domhain i struchtúr na bhfillteán a scipeáil gan rabhadh, rud a d'fhágfadh uaslódálacha neamhiomlána nó fillteáin dhúblacha.
        workarounds_title: Réitigh mholta
        workarounds_html: "<li><strong>Úsáid tiomántán fíorúil:</strong> oscail an Pras Ordaithe agus rith: <code>subst X: \"C:\\cosan\\fada\\chuig\\fillteain\"</code><br>Ansin uaslódáil ón tiomántán fíorúil <code>X:\\</code></li><li><strong>Téigh níos gaire do na comhaid:</strong> oscail fofhillteán níos gaire do do chomhaid sula roghnaíonn tú an fillteán uaslódála</li><li><strong>Úsáid cosán níos giorra:</strong> cóipeáil do chomhaid chuig áit níos giorra, ar nós <code>C:\\uploads\\</code>, roimh an uaslódáil</li><li><strong>Comhbhrúigh an fillteán ar dtús:</strong> comhbhrúigh an fillteán ina chomhad ZIP agus uaslódáil an comhad ZIP ina ionad</li>"
        advanced_title: "Ardleibhéal: cumasaigh cosáin fhada in Windows 10/11"
        advanced_description_html: Ó Windows 10 leagan 1607 ar aghaidh, is féidir leat tacaíocht do chosáin níos faide a chumasú. <strong>Tabhair faoi deara:</strong> teastaíonn cearta riarthóra agus b'fhéidir nach n-oibreoidh sé i ngach brabhsálaí. Tá na réitigh thuas níos iontaofa.
        registry_steps_title: Céimeanna chun cosáin fhada a chumasú
        registry_steps_html: "<li>Brúigh <kbd>Win + R</kbd>, clóscríobh <code>regedit</code> agus brúigh Enter</li><li>Téigh go: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Aimsigh nó cruthaigh luach DWORD darb ainm <code>LongPathsEnabled</code> agus socraigh é go <code>1</code></li><li>Atosaigh an ríomhaire chun an t-athrú a chur i bhfeidhm</li><li>Bain triail as an uaslódáil arís (d'fhéadfadh an tacaíocht a bheith éagsúil ó bhrabhsálaí go brabhsálaí)</li>"
        browser_disclaimer_html: "<strong>Tábhachtach:</strong> fiú leis an socrú clárlainne seo cumasaithe, bíonn tacaíocht do chosáin fhada éagsúil ó bhrabhsálaí go brabhsálaí. D'fhéadfadh Chrome, Edge agus Firefox an teorainn 259 carachtar a chur i bhfeidhm fós. Tá na réitigh thuas níos iontaofa."
