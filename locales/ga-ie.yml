      show:
        title: Cuir isteach do phasfhocal sealadach
        description_html: "Tá tú ar tí teachtaireacht shlán a fheiceáil. Chun í a oscailt, caithfidh tú do phasfhocal sealadach a chur isteach.<br>Is teaghrán randamach uathúil é an pasfhocal sealadach a shainaithníonn thú. Seoladh an pasfhocal sealadach chugat i ríomhphost ar leith (ábhar: Pasfhocal sealadach)."
        what_is_this: Cad é seo?
        login: Logáil isteach
        submit: Fíoraigh an pasfhocal sealadach
        submit_email: Seol isteach
        if_you_have_account: "(má tá cuntas agat cheana)"
        request_temporary_user_header: Iarr pasfhocal sealadach nua
        request_temporary_user_description_html: Is féidir leat pasfhocal sealadach nua a iarraidh chun an teachtaireacht seo a oscailt. Cuir isteach do sheoladh ríomhphoist thíos chun pasfhocal sealadach nua a iarraidh don teachtaireacht shlán seo.
        info_header: Faisnéis faoin bpasfhocal sealadach
        info_body_html: "<p>Is sraith uathúil uimhreacha agus litreacha é an pasfhocal sealadach, mar shampla:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Níl sa phasfhocal sealadach seo ach sampla le go bhfeicfidh tú cén chuma atá air – ní féidir é a úsáid.</em></p><p>I do bhosca isteach gheobhaidh tú <strong>dhá ríomhphost</strong>: ceann leis an teachtaireacht shlán agus ceann le <strong>hábhar a thosaíonn le: Pasfhocal sealadach</strong>. Tá do phasfhocal sealadach uathúil don chóras seo sa dara ceann.</p><p>Mura bhfuair tú ríomhphost le pasfhocal sealadach, b'fhéidir go bhfuil cuntas agat ar an gcóras seo cheana. Sa chás sin, cliceáil ar “Logáil isteach”.</p><p>Má cheapann tú gur cheart go bhfaighfeá pasfhocal sealadach ach nach bhfuair, cliceáil ar “Iarr pasfhocal sealadach” chun ceann nua a fháil.</p>"
        email_address: Seoladh ríomhphoist
        email_not_permitted: Níl cead ag an seoladh ríomhphoist seo an teachtaireacht shlán seo a fheiceáil.
        email_not_permitted_description_html: <p>Seiceáil an ríomhphost leis an teachtaireacht shlán a fuair tú agus cuir isteach an seoladh ríomhphoist díreach mar a seoladh an teachtaireacht.</p><p>Mar shampla, más féidir le do sheoladh a bheith sean.omurchu@comhlacht.ie agus somurchu@comhlacht.ie araon, níl a fhios ag an gcóras gurb é an seoladh céanna é. Má seoladh an teachtaireacht shlán chuig sean.omurchu@comhlacht.ie, is é sin an seoladh ba chóir duit a chur isteach anseo.</p><p>Mura bhfuil tú cinnte, déan teagmháil le seoltóir na teachtaireachta sláine.</p>
        email_can_login: Tá cuntas agat ar an gcóras seo cheana
        email_can_login_description_html: <p>Is féidir leat logáil isteach ar an gcóras seo leis an seoladh ríomhphoist seo agus do phasfhocal.</p><p>Cliceáil ar an gcnaipe Logáil isteach thíos chun logáil isteach le do chuntas reatha.</p>
        temporary_user_delivered_header: Seoladh an pasfhocal sealadach
        temporary_user_delivered_description_html: <p>Seoladh pasfhocal sealadach chuig do sheoladh ríomhphoist. Seiceáil do bhosca isteach, dún an fhuinneog seo agus cuir isteach an pasfhocal sealadach.</p>
