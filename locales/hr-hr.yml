        description_html: <strong>Korisnici sustava Windows:</strong> Windows ograničava putanje datoteka na 259 znakova. Pri učitavanju mapa s lokacija s dugim putanjama datoteke duboko u strukturi mapa mogu biti izostavljene bez upozorenja, što može uzrokovati nepotpuna učitavanja ili duplicirane mape.
        workarounds_title: Preporučena rješenja
        workarounds_html: "<li><strong>Upotrijebite virtualni pogon:</strong> otvorite naredbeni redak i pokrenite: <code>subst X: \"C:\\vasa\\duga\\putanja\\do\\mape\"</code><br>Zatim učitavajte s virtualnog pogona <code>X:\\</code></li><li><strong>Približite se datotekama:</strong> prije odabira mape za učitavanje otvorite podmapu bliže datotekama</li><li><strong>Upotrijebite kraću putanju:</strong> prije učitavanja kopirajte datoteke na kraću lokaciju, primjerice <code>C:\\uploads\\</code></li><li><strong>Najprije sažmite mapu:</strong> sažmite mapu u ZIP datoteku i učitajte ZIP datoteku</li>"
        advanced_title: "Napredno: omogućivanje dugih putanja u sustavu Windows 10/11"
        advanced_description_html: Od verzije 1607 sustava Windows 10 možete omogućiti podršku za dulje putanje. <strong>Napomena:</strong> za to su potrebne administratorske ovlasti i možda neće raditi u svim preglednicima. Gornja rješenja su pouzdanija.
        registry_steps_title: Koraci za omogućivanje dugih putanja
        registry_steps_html: "<li>Pritisnite <kbd>Win + R</kbd>, upišite <code>regedit</code> i pritisnite Enter</li><li>Idite na: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Pronađite ili izradite DWORD vrijednost naziva <code>LongPathsEnabled</code> i postavite je na <code>1</code></li><li>Ponovno pokrenite računalo da bi promjena stupila na snagu</li><li>Ponovno testirajte učitavanje (podrška se može razlikovati ovisno o pregledniku)</li>"
        browser_disclaimer_html: "<strong>Važno:</strong> čak i uz omogućenu ovu postavku registra podrška za duge putanje razlikuje se ovisno o pregledniku. Chrome, Edge i Firefox i dalje mogu primjenjivati ograničenje od 259 znakova. Gornja rješenja su pouzdanija."
