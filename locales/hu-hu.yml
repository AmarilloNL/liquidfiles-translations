      windows_path_warning:
        title: Útvonalhossz-korlátozás Windows rendszerben
        description_html: <strong>Windows-felhasználók:</strong> a Windows 259 karakterre korlátozza a fájlok elérési útját. Hosszú elérési utú helyekről történő mappafeltöltéskor a mappaszerkezet mélyén lévő fájlok figyelmeztetés nélkül kimaradhatnak, ami hiányos feltöltéseket vagy ismétlődő mappákat okozhat.
        workarounds_title: Javasolt megoldások
        workarounds_html: "<li><strong>Használjon virtuális meghajtót:</strong> nyissa meg a parancssort, és futtassa: <code>subst X: \"C:\\az\\on\\hosszu\\utvonala\\a\\mappahoz\"</code><br>Ezután a virtuális <code>X:\\</code> meghajtóról töltsön fel</li><li><strong>Lépjen közelebb a fájlokhoz:</strong> a feltöltendő mappa kiválasztása előtt nyisson meg egy, a fájlokhoz közelebbi almappát</li><li><strong>Használjon rövidebb útvonalat:</strong> feltöltés előtt másolja a fájlokat egy rövidebb helyre, például a <code>C:\\uploads\\</code> mappába</li><li><strong>Először tömörítse a mappát:</strong> tömörítse a mappát ZIP-fájlba, és helyette a ZIP-fájlt töltse fel</li>"
        advanced_title: "Speciális: hosszú elérési utak engedélyezése Windows 10/11 rendszerben"
        advanced_description_html: A Windows 10 1607-es verziójától kezdve engedélyezheti a hosszabb elérési utak támogatását. <strong>Megjegyzés:</strong> ehhez rendszergazdai jogosultság szükséges, és nem minden böngészőben működik. A fenti megoldások megbízhatóbbak.
        registry_steps_title: A hosszú elérési utak engedélyezésének lépései
        registry_steps_html: "<li>Nyomja meg a <kbd>Win + R</kbd> billentyűkombinációt, írja be: <code>regedit</code>, majd nyomja meg az Enter billentyűt</li><li>Lépjen ide: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Keressen meg vagy hozzon létre egy <code>LongPathsEnabled</code> nevű DWORD értéket, és állítsa <code>1</code> értékre</li><li>Indítsa újra a számítógépet, hogy a módosítás érvénybe lépjen</li><li>Próbálja újra a feltöltést (a támogatás böngészőnként eltérő lehet)</li>"
        browser_disclaimer_html: "<strong>Fontos:</strong> még ezzel a beállításjegyzék-beállítással is böngészőnként eltér a hosszú elérési utak támogatása. A Chrome, az Edge és a Firefox továbbra is alkalmazhatja a 259 karakteres korlátot. A fenti megoldások megbízhatóbbak."
