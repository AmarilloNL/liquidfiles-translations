      windows_path_warning:
        title: Limite di lunghezza dei percorsi in Windows
        description_html: <strong>Utenti Windows:</strong> Windows limita i percorsi dei file a 259 caratteri. Quando si caricano cartelle da posizioni con percorsi lunghi, i file situati in profondità nella struttura potrebbero essere esclusi senza avviso, causando caricamenti incompleti o cartelle duplicate.
        workarounds_title: Soluzioni consigliate
        workarounds_html: "<li><strong>Usare un'unità virtuale:</strong> aprire il prompt dei comandi ed eseguire: <code>subst X: \"C:\\percorso\\lungo\\della\\cartella\"</code><br>Quindi caricare dall'unità virtuale <code>X:\\</code></li><li><strong>Avvicinarsi ai file:</strong> aprire una sottocartella più vicina ai file prima di selezionare la cartella da caricare</li><li><strong>Usare un percorso più breve:</strong> copiare i file in una posizione più breve come <code>C:\\uploads\\</code> prima del caricamento</li><li><strong>Comprimere prima la cartella:</strong> comprimere la cartella in un file ZIP e caricare il file ZIP</li>"
        advanced_title: "Avanzato: attivare i percorsi lunghi in Windows 10/11"
        advanced_description_html: A partire da Windows 10 versione 1607 è possibile attivare il supporto per percorsi più lunghi. <strong>Nota:</strong> sono necessari privilegi di amministratore e potrebbe non funzionare in tutti i browser. Le soluzioni indicate sopra sono più affidabili.
        registry_steps_title: Passaggi per attivare i percorsi lunghi
        registry_steps_html: "<li>Premere <kbd>Win + R</kbd>, digitare <code>regedit</code> e premere Invio</li><li>Andare a: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Trovare o creare un valore DWORD denominato <code>LongPathsEnabled</code> e impostarlo su <code>1</code></li><li>Riavviare il computer per rendere effettiva la modifica</li><li>Provare di nuovo il caricamento (il supporto può variare a seconda del browser)</li>"
        browser_disclaimer_html: "<strong>Importante:</strong> anche con questa impostazione del registro attivata, il supporto dei percorsi lunghi varia a seconda del browser. Chrome, Edge e Firefox potrebbero comunque applicare il limite di 259 caratteri. Le soluzioni indicate sopra sono più affidabili."
