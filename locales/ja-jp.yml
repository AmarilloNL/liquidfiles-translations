      windows_path_warning:
        title: Windows のパスの長さの制限
        description_html: <strong>Windows をお使いの方へ：</strong>Windows ではファイルパスの長さが 259 文字に制限されています。長いパスの場所からフォルダーをアップロードすると、フォルダー構造の深い階層にあるファイルが警告なしにスキップされ、アップロードが不完全になったりフォルダーが重複したりする可能性があります。
        workarounds_title: 推奨される回避策
        workarounds_html: "<li><strong>仮想ドライブを使用する：</strong>コマンドプロンプトを開き、次を実行します：<code>subst X: \"C:\\totemo\\nagai\\pasu\"</code><br>その後、仮想ドライブ <code>X:\\</code> からアップロードします</li><li><strong>ファイルに近い場所に移動する：</strong>アップロードするフォルダーを選択する前に、ファイルに近いサブフォルダーを開きます</li><li><strong>短いパスを使用する：</strong>アップロード前に、<code>C:\\uploads\\</code> などの短い場所にファイルをコピーします</li><li><strong>先にフォルダーを圧縮する：</strong>フォルダーを ZIP ファイルに圧縮し、代わりに ZIP ファイルをアップロードします</li>"
        advanced_title: "上級者向け：Windows 10/11 で長いパスを有効にする"
        advanced_description_html: Windows 10 バージョン 1607 以降では、より長いパスのサポートを有効にできます。<strong>注意：</strong>管理者権限が必要で、すべてのブラウザーで動作するとは限りません。上記の回避策のほうが確実です。
        registry_steps_title: 長いパスを有効にする手順
        registry_steps_html: "<li><kbd>Win + R</kbd> を押し、<code>regedit</code> と入力して Enter キーを押します</li><li>次の場所に移動します：<code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li><code>LongPathsEnabled</code> という名前の DWORD 値を見つけるか作成し、<code>1</code> に設定します</li><li>変更を反映させるためにコンピューターを再起動します</li><li>もう一度アップロードを試します（サポート状況はブラウザーによって異なる場合があります）</li>"
        browser_disclaimer_html: "<strong>重要：</strong>このレジストリ設定を有効にしても、長いパスのサポート状況はブラウザーによって異なります。Chrome、Edge、Firefox では引き続き 259 文字の制限が適用される場合があります。上記の回避策のほうが確実です。"
