        temporary_user_expired: Šio laikinojo slaptažodžio galiojimas baigėsi. Naujas laikinasis slaptažodis išsiųstas jūsų el. pašto adresu. Patikrinkite gautuosius ir naudokite naująjį laikinąjį slaptažodį.
        not_authorized_to_view_message: "Neturite teisės peržiūrėti pranešimo, kurio ID: %{message_id}. Patikrinkite, ar šis pranešimas buvo išsiųstas jums."
      show:
        title: Įveskite laikinąjį slaptažodį
        description_html: "Ketinate peržiūrėti saugų pranešimą. Norėdami jį atidaryti, turite įvesti laikinąjį slaptažodį.<br>Laikinasis slaptažodis – tai unikali atsitiktinė simbolių eilutė, kuri jus identifikuoja. Laikinasis slaptažodis jums buvo išsiųstas atskiru el. laišku (tema: Laikinasis slaptažodis)."
        what_is_this: Kas tai?
        login: Prisijungti
        submit: Tikrinti laikinąjį slaptažodį
        submit_email: Pateikti
        if_you_have_account: "(jei jau turite paskyrą)"
        request_temporary_user_header: Prašyti naujo laikinojo slaptažodžio
        request_temporary_user_description_html: Galite paprašyti naujo laikinojo slaptažodžio šiam pranešimui atidaryti. Žemiau įveskite el. pašto adresą, kad paprašytumėte naujo laikinojo slaptažodžio šiam saugiam pranešimui.
        info_header: Informacija apie laikinąjį slaptažodį
        info_body_html: "<p>Laikinasis slaptažodis – tai unikali skaitmenų ir raidžių seka, pavyzdžiui:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Šis laikinasis slaptažodis yra tik pavyzdys, kad matytumėte, kaip jis atrodo, – jo naudoti negalima.</em></p><p>Gautuosiuose rasite <strong>du el. laiškus</strong>: laišką su saugiu pranešimu ir laišką, kurio <strong>tema prasideda žodžiais: Laikinasis slaptažodis</strong>. Pastarajame yra jūsų unikalus laikinasis slaptažodis šiai sistemai.</p><p>Jei negavote el. laiško su laikinuoju slaptažodžiu, galbūt šioje sistemoje jau turite paskyrą. Tokiu atveju spustelėkite „Prisijungti“.</p><p>Jei manote, kad turėjote gauti laikinąjį slaptažodį, bet jo negavote, spustelėkite „Prašyti laikinojo slaptažodžio“, kad gautumėte naują.</p>"
        email_address: El. pašto adresas
        email_not_permitted: Šis el. pašto adresas neturi teisės peržiūrėti šio saugaus pranešimo.
        email_not_permitted_description_html: <p>Patikrinkite gautą saugaus pranešimo el. laišką ir įveskite el. pašto adresą tiksliai taip, kaip pranešimas buvo išsiųstas.</p><p>Pavyzdžiui, jei jūsų el. pašto adresas gali būti ir jonas.jonaitis@imone.lt, ir jjonaitis@imone.lt, sistema negali žinoti, kad tai tas pats adresas. Jei saugus pranešimas buvo išsiųstas adresu jonas.jonaitis@imone.lt, čia turite įvesti būtent šį adresą.</p><p>Jei abejojate, susisiekite su saugaus pranešimo siuntėju.</p>
        email_can_login: Šioje sistemoje jau turite paskyrą
        email_can_login_description_html: <p>Į šią sistemą galite prisijungti šiuo el. pašto adresu ir savo slaptažodžiu.</p><p>Spustelėkite žemiau esantį mygtuką Prisijungti, kad prisijungtumėte esama paskyra.</p>
        temporary_user_delivered_header: Laikinasis slaptažodis išsiųstas
        temporary_user_delivered_description_html: <p>Laikinasis slaptažodis išsiųstas jūsų el. pašto adresu. Patikrinkite gautuosius, uždarykite šį langą ir įveskite laikinąjį slaptažodį.</p>
