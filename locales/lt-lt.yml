        advanced_description_html: Nuo Windows 10 versijos 1607 galite įjungti ilgesnių kelių palaikymą. <strong>Pastaba:</strong> tam reikia administratoriaus teisių ir tai gali veikti ne visose naršyklėse. Aukščiau pateikti sprendimai yra patikimesni.
        registry_steps_title: Ilgų kelių įjungimo veiksmai
        registry_steps_html: "<li>Paspauskite <kbd>Win + R</kbd>, įveskite <code>regedit</code> ir paspauskite Enter</li><li>Eikite į: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Raskite arba sukurkite DWORD reikšmę pavadinimu <code>LongPathsEnabled</code> ir nustatykite ją į <code>1</code></li><li>Iš naujo paleiskite kompiuterį, kad pakeitimas įsigaliotų</li><li>Dar kartą išbandykite įkėlimą (palaikymas įvairiose naršyklėse gali skirtis)</li>"
        browser_disclaimer_html: "<strong>Svarbu:</strong> net įjungus šį registro nustatymą, ilgų kelių palaikymas įvairiose naršyklėse skiriasi. Chrome, Edge ir Firefox vis tiek gali taikyti 259 simbolių ribą. Aukščiau pateikti sprendimai yra patikimesni."
