        title: Prisijunkite, kad atidarytumėte saugų pranešimą
        authenticate_description_html: Ketinate peržiūrėti saugų pranešimą. Pirmiausia turite prisijungti. Norėdami tęsti, įveskite el. pašto adresą arba prisijunkite.<br>Jei šioje sistemoje neturite paskyros, įveskite el. pašto adresą ir mes atsiųsime saugią nuorodą adresui patvirtinti.
        unauthenticated_html: <h4>Neteisingas naudotojo vardas arba slaptažodis</h4><p>Įveskite naudotojo vardą ir slaptažodį. Slaptažodį galite atkurti žemiau esančiu mygtuku Slaptažodžio atkūrimas.</p>
        unauthorized_to_view_check_email_html: <h4>Neįgaliotas el. pašto adresas</h4><p>Patikrinkite, ar saugus pranešimas [<span class="font-monospace fw-bold">%{message_id}</span>] buvo išsiųstas jums, ir įveskite el. pašto adresą tiksliai taip, kaip pranešimas buvo išsiųstas.</p><p>Pavyzdžiui, jei jūsų el. pašto adresas gali būti ir jonas.jonaitis@imone.lt, ir jjonaitis@imone.lt, sistema negali žinoti, kad tai tas pats adresas. Jei saugus pranešimas buvo išsiųstas adresu jonas.jonaitis@imone.lt, čia turite įvesti būtent šį adresą.</p><p>Jei abejojate, susisiekite su saugaus pranešimo siuntėju.</p>
