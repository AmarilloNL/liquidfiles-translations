        authenticate_description_html: Jūs gatavojaties skatīt drošu ziņojumu. Vispirms jāpiesakās. Lai turpinātu, ievadiet savu e-pasta adresi vai piesakieties.<br>Ja jums šajā sistēmā nav konta, ievadiet savu e-pasta adresi, un mēs nosūtīsim drošu saiti adreses apstiprināšanai.
        unauthenticated_html: <h4>Nederīgs lietotājvārds vai parole</h4><p>Ievadiet savu lietotājvārdu un paroli. Paroli varat atiestatīt ar zemāk esošo pogu Paroles atiestatīšana.</p>
        unauthorized_to_view_check_email_html: <h4>Neautorizēta e-pasta adrese</h4><p>Pārbaudiet, vai drošais ziņojums [<span class="font-monospace fw-bold">%{message_id}</span>] tika nosūtīts jums, un ievadiet e-pasta adresi tieši tā, kā ziņojums tika nosūtīts.</p><p>Piemēram, ja jūsu e-pasta adrese var būt gan janis.berzins@uznemums.lv, gan jberzins@uznemums.lv, sistēma nevar zināt, ka tā ir viena un tā pati adrese. Ja drošais ziņojums tika nosūtīts uz janis.berzins@uznemums.lv, šeit jāievada tieši šī adrese.</p><p>Ja neesat pārliecināts, sazinieties ar drošā ziņojuma sūtītāju.</p>
