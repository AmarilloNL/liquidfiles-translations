      windows_path_warning:
        title: Windows ceļa garuma ierobežojums
        description_html: <strong>Windows lietotājiem:</strong> Windows ierobežo failu ceļus līdz 259 rakstzīmēm. Augšupielādējot mapes no vietām ar gariem ceļiem, faili, kas atrodas dziļi mapju struktūrā, var tikt nemanāmi izlaisti, radot nepilnīgas augšupielādes vai mapju dublikātus.
        workarounds_title: Ieteicamie risinājumi
        workarounds_html: "<li><strong>Izmantojiet virtuālu disku:</strong> atveriet komandu uzvedni un izpildiet: <code>subst X: \"C:\\jusu\\garais\\cels\\uz\\mapi\"</code><br>Pēc tam augšupielādējiet no virtuālā diska <code>X:\\</code></li><li><strong>Pārejiet tuvāk failiem:</strong> pirms augšupielādējamās mapes atlasīšanas pārejiet uz apakšmapi tuvāk failiem</li><li><strong>Izmantojiet īsāku ceļu:</strong> pirms augšupielādes nokopējiet failus uz īsāku vietu, piemēram, <code>C:\\uploads\\</code></li><li><strong>Vispirms saspiediet mapi:</strong> saspiediet mapi ZIP failā un augšupielādējiet ZIP failu</li>"
        advanced_title: "Papildu: iespējot garos ceļus Windows 10/11"
        advanced_description_html: Sākot ar Windows 10 versiju 1607, varat iespējot garāku ceļu atbalstu. <strong>Ievērībai:</strong> tam nepieciešamas administratora tiesības, un tas var nedarboties visās pārlūkprogrammās. Iepriekš minētie risinājumi ir uzticamāki.
        registry_steps_title: Darbības garo ceļu iespējošanai
        registry_steps_html: "<li>Nospiediet <kbd>Win + R</kbd>, ierakstiet <code>regedit</code> un nospiediet Enter</li><li>Pārejiet uz: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Atrodiet vai izveidojiet DWORD vērtību ar nosaukumu <code>LongPathsEnabled</code> un iestatiet to uz <code>1</code></li><li>Restartējiet datoru, lai izmaiņas stātos spēkā</li><li>Pārbaudiet augšupielādi vēlreiz (atbalsts dažādās pārlūkprogrammās var atšķirties)</li>"
        browser_disclaimer_html: "<strong>Svarīgi:</strong> pat ar šo reģistra iestatījumu garo ceļu atbalsts dažādās pārlūkprogrammās atšķiras. Chrome, Edge un Firefox joprojām var piemērot 259 rakstzīmju ierobežojumu. Iepriekš minētie risinājumi ir uzticamāki."
