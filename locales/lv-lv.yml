      show:
        title: Lūdzu, ievadiet savu pagaidu paroli
        description_html: "Jūs gatavojaties skatīt drošu ziņojumu. Lai to atvērtu, jāievada pagaidu parole.<br>Pagaidu parole ir unikāla, nejauša rakstzīmju virkne, kas jūs identificē. Pagaidu parole jums tika nosūtīta atsevišķā e-pastā (temats: Pagaidu parole)."
        what_is_this: Kas tas ir?
        login: Pieteikties
        submit: Pārbaudīt pagaidu paroli
        submit_email: Iesniegt
        if_you_have_account: "(ja jums jau ir konts)"
        request_temporary_user_header: Pieprasīt jaunu pagaidu paroli
        request_temporary_user_description_html: Varat pieprasīt jaunu pagaidu paroli, lai atvērtu šo ziņojumu. Lūdzu, zemāk ievadiet savu e-pasta adresi, lai pieprasītu jaunu pagaidu paroli šim drošajam ziņojumam.
        info_header: Informācija par pagaidu paroli
        info_body_html: "<p>Pagaidu parole ir unikāla ciparu un burtu virkne, piemēram:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Šī pagaidu parole ir tikai piemērs, lai redzētu, kā tā izskatās, – to nevar izmantot.</em></p><p>Savā iesūtnē atradīsiet <strong>divus e-pastus</strong>: e-pastu ar drošo ziņojumu un e-pastu, kura <strong>temats sākas ar: Pagaidu parole</strong>. Pēdējais satur jūsu unikālo pagaidu paroli šai sistēmai.</p><p>Ja neesat saņēmis e-pastu ar pagaidu paroli, iespējams, jums šajā sistēmā jau ir konts. Šādā gadījumā noklikšķiniet uz “Pieteikties”.</p><p>Ja uzskatāt, ka jums vajadzēja saņemt pagaidu paroli, bet tā nav saņemta, noklikšķiniet uz “Pieprasīt pagaidu paroli”, lai saņemtu jaunu.</p>"
        email_address: E-pasta adrese
        email_not_permitted: Šai e-pasta adresei nav atļaujas skatīt šo drošo ziņojumu.
        email_not_permitted_description_html: <p>Pārbaudiet saņemto drošā ziņojuma e-pastu un ievadiet e-pasta adresi tieši tā, kā ziņojums tika nosūtīts.</p><p>Piemēram, ja jūsu e-pasta adrese var būt gan janis.berzins@uznemums.lv, gan jberzins@uznemums.lv, sistēma nevar zināt, ka tā ir viena un tā pati adrese. Ja drošais ziņojums tika nosūtīts uz janis.berzins@uznemums.lv, šeit jāievada tieši šī adrese.</p><p>Ja neesat pārliecināts, sazinieties ar drošā ziņojuma sūtītāju.</p>
        email_can_login: Jums šajā sistēmā jau ir konts
        email_can_login_description_html: <p>Šajā sistēmā varat pieteikties ar šo e-pasta adresi un savu paroli.</p><p>Noklikšķiniet uz zemāk esošās pogas Pieteikties, lai pieteiktos ar esošo kontu.</p>
        temporary_user_delivered_header: Pagaidu parole nosūtīta
