        info_header: Informazzjoni dwar il-password temporanja
        info_body_html: "<p>Il-password temporanja hija sekwenza unika ta' numri u ittri, pereżempju:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Din il-password temporanja hija biss eżempju biex tara kif tidher – ma tistax tintuża.</em></p><p>Fl-inbox tiegħek issib <strong>żewġ emails</strong>: waħda bil-messaġġ sigur u waħda b'<strong>suġġett li jibda b': Password temporanja</strong>. It-tieni waħda fiha l-password temporanja unika tiegħek għal din is-sistema.</p><p>Jekk ma rċevejtx email b'password temporanja, forsi diġà għandek kont f'din is-sistema. F'dak il-każ, ikklikkja “Idħol”.</p><p>Jekk taħseb li kellek tirċievi password temporanja iżda ma rċevejthiex, ikklikkja “Itlob password temporanja” biex tirċievi waħda ġdida.</p>"
