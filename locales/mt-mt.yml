        title: Limitazzjoni tat-tul tal-mogħdija f'Windows
        description_html: <strong>Utenti tal-Windows:</strong> il-Windows jillimita l-mogħdijiet tal-fajls għal 259 karattru. Meta ttella' folders minn postijiet b'mogħdijiet twal, fajls fil-fond tal-istruttura tal-folders jistgħu jinqabżu mingħajr twissija, u dan iwassal għal tlugħ mhux komplut jew folders duplikati.
        workarounds_title: Soluzzjonijiet rakkomandati
        workarounds_html: "<li><strong>Uża drive virtwali:</strong> iftaħ il-Command Prompt u ħaddem: <code>subst X: \"C:\\moghdija\\twila\\ghall\\folder\"</code><br>Imbagħad tella' mid-drive virtwali <code>X:\\</code></li><li><strong>Mur eqreb lejn il-fajls:</strong> iftaħ subfolder eqreb lejn il-fajls tiegħek qabel ma tagħżel il-folder tat-tlugħ</li><li><strong>Uża mogħdija iqsar:</strong> ikkopja l-fajls tiegħek f'post iqsar, bħal <code>C:\\uploads\\</code>, qabel it-tlugħ</li><li><strong>L-ewwel ikkompressa l-folder:</strong> ikkompressa l-folder f'fajl ZIP u tella' l-fajl ZIP minflok</li>"
        advanced_title: "Avvanzat: attiva mogħdijiet twal f'Windows 10/11"
        advanced_description_html: Mill-verżjoni 1607 tal-Windows 10 'il quddiem, tista' tattiva l-appoġġ għal mogħdijiet itwal. <strong>Nota:</strong> huma meħtieġa drittijiet tal-amministratur u jista' ma jaħdimx fil-browsers kollha. Is-soluzzjonijiet ta' hawn fuq huma aktar affidabbli.
        registry_steps_title: Passi biex tattiva mogħdijiet twal
        registry_steps_html: "<li>Agħfas <kbd>Win + R</kbd>, ittajpja <code>regedit</code> u agħfas Enter</li><li>Mur għal: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Sib jew oħloq valur DWORD bl-isem <code>LongPathsEnabled</code> u ssettjah għal <code>1</code></li><li>Erġa' ixgħel il-kompjuter biex il-bidla tidħol fis-seħħ</li><li>Erġa' pprova t-tlugħ (l-appoġġ jista' jvarja skont il-browser)</li>"
        browser_disclaimer_html: "<strong>Importanti:</strong> anke b'dan is-setting tar-reġistru attivat, l-appoġġ għal mogħdijiet twal ivarja skont il-browser. Chrome, Edge u Firefox xorta jistgħu japplikaw il-limitu ta' 259 karattru. Is-soluzzjonijiet ta' hawn fuq huma aktar affidabbli."
