        info_header: Informatie over het tijdelijke wachtwoord
        info_body_html: '<p>Een tijdelijk wachtwoord is een unieke reeks cijfers en
          letters, bijvoorbeeld:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Dit
          tijdelijke wachtwoord is alleen een voorbeeld zodat u ziet hoe het eruitziet.
          U kunt het niet echt gebruiken.</em></p><p>In uw inbox vindt u <strong>twee
          e-mails</strong>: de e-mail met het beveiligde bericht en een e-mail met
          een <strong>onderwerp dat begint met: Tijdelijk wachtwoord</strong>. In
          die e-mail staat uw unieke tijdelijke wachtwoord voor dit systeem.</p><p>Heeft
          u geen e-mail met een tijdelijk wachtwoord ontvangen? Dan heeft u misschien
          al een account op dit systeem. Klik in dat geval op "Aanmelden".</p><p>Denkt
          u dat u een tijdelijk wachtwoord had moeten ontvangen maar is dat niet gebeurd?
          Klik dan op "Tijdelijk wachtwoord aanvragen" om een nieuw wachtwoord te
          krijgen.</p>'
