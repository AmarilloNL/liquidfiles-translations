        unauthorized_to_view_check_email_html: <h4>Nieuprawniony adres e-mail</h4><p>Sprawdź, czy bezpieczna wiadomość [<span class="font-monospace fw-bold">%{message_id}</span>] została wysłana do Ciebie, i wprowadź adres e-mail dokładnie w takiej postaci, w jakiej została wysłana.</p><p>Jeśli na przykład Twój adres może brzmieć zarówno jan.kowalski@firma.pl, jak i jkowalski@firma.pl, system nie może wiedzieć, że to ten sam adres. Jeśli bezpieczna wiadomość została wysłana na jan.kowalski@firma.pl, właśnie ten adres musisz tu wpisać.</p><p>W razie wątpliwości skontaktuj się z nadawcą bezpiecznej wiadomości.</p>
