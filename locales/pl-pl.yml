      local_domains: Użytkownik lokalny może wysyłać pliki do każdego. Użytkownik nielokalny może wysyłać pliki tylko do użytkowników lokalnych. Przy pierwszym logowaniu użytkownika lub utworzeniu konta domena adresu e-mail jest porównywana z tymi domenami, aby określić, czy użytkownik jest lokalny.
