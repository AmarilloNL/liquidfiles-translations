        title: Ograniczenie długości ścieżki w systemie Windows
        description_html: <strong>Użytkownicy systemu Windows:</strong> Windows ogranicza ścieżki plików do 259 znaków. Podczas przesyłania folderów z lokalizacji o długich ścieżkach pliki znajdujące się głęboko w strukturze folderów mogą zostać pominięte bez ostrzeżenia, co może powodować niekompletne przesyłanie lub zduplikowane foldery.
        workarounds_title: Zalecane rozwiązania
        workarounds_html: "<li><strong>Użyj dysku wirtualnego:</strong> otwórz wiersz polecenia i uruchom: <code>subst X: \"C:\\twoja\\dluga\\sciezka\\do\\folderu\"</code><br>Następnie prześlij pliki z dysku wirtualnego <code>X:\\</code></li><li><strong>Przejdź bliżej plików:</strong> otwórz podfolder bliżej plików, zanim wybierzesz folder do przesłania</li><li><strong>Użyj krótszej ścieżki:</strong> przed przesłaniem skopiuj pliki do krótszej lokalizacji, np. <code>C:\\uploads\\</code></li><li><strong>Najpierw spakuj folder:</strong> skompresuj folder do pliku ZIP i prześlij zamiast niego ten plik ZIP</li>"
        advanced_title: "Zaawansowane: włączanie długich ścieżek w systemie Windows 10/11"
        advanced_description_html: Od wersji 1607 systemu Windows 10 możesz włączyć obsługę dłuższych ścieżek. <strong>Uwaga:</strong> wymaga to uprawnień administratora i może nie działać we wszystkich przeglądarkach. Powyższe rozwiązania są bardziej niezawodne.
        registry_steps_title: Kroki włączania długich ścieżek
        registry_steps_html: "<li>Naciśnij <kbd>Win + R</kbd>, wpisz <code>regedit</code> i naciśnij Enter</li><li>Przejdź do: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Znajdź lub utwórz wartość DWORD o nazwie <code>LongPathsEnabled</code> i ustaw ją na <code>1</code></li><li>Uruchom ponownie komputer, aby zmiana zaczęła obowiązywać</li><li>Ponownie przetestuj przesyłanie (obsługa może się różnić w zależności od przeglądarki)</li>"
        browser_disclaimer_html: "<strong>Ważne:</strong> nawet po włączeniu tego ustawienia rejestru obsługa długich ścieżek różni się w zależności od przeglądarki. Chrome, Edge i Firefox mogą nadal stosować limit 259 znaków. Powyższe rozwiązania są bardziej niezawodne."
