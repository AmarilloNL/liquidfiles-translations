      delete_downloaded_files_after: Pobrany plik jest przechowywany przez ten czas. Powinien być na tyle długi, aby odbiorca mógł wybrać inną lokalizację pobierania lub zacząć od nowa, ale na tyle krótki, aby link nie trafił do kolejnych osób.
      file_expiration: Umożliwia użytkownikom zmianę czasu wygaśnięcia plików. Jeśli opcja jest wyłączona, wszystkie pliki otrzymują domyślny czas wygaśnięcia.
      default_expire_files_after: Pliki wygasną po tym czasie.
      blocked_file_extensions: Blokuj pliki z tymi rozszerzeniami (bez rozróżniania wielkości liter).
      virus_scan: Skanuj wszystkie przesłane pliki programem antywirusowym ClamAV
      require_authentication_permission: Po włączeniu użytkownicy mogą decydować, czy wymagane jest uwierzytelnianie
      default_bcc_myself: Po włączeniu wiadomości są domyślnie wysyłane także do samego użytkownika
      permitted_file_extensions: "Jeśli pole jest puste, dozwolone są wszystkie rozszerzenia. Jeśli podano co najmniej jedno rozszerzenie, dozwolone są tylko wpisane typy plików. Przykład: png, gif, jpg, txt"
      new_external_recipient_is_nonlocal: Gdy wiadomość jest wysyłana do nowego odbiorcy, czy ma on zostać utworzony jako użytkownik nielokalny (aby mógł odpowiedzieć), czy jako użytkownik zewnętrzny?
      email_message_on_top: Po zaznaczeniu wiadomość jest umieszczana nad listą plików w e-mailu do odbiorców. Po odznaczeniu lista plików jest umieszczana nad wiadomością.
      email_sender: Ten adres e-mail będzie używany jako nadawca wiadomości generowanych przez system, np. przy resetowaniu haseł. Aby uniknąć oznaczania tych wiadomości jako spam, musi to być prawdziwy adres e-mail.
      email_host: Załączniki będą używać tego adresu URL jako adresu bazowego. Zwykle jest to http://nazwahosta.domena lub https://nazwahosta.domena, ale może to być również https://nazwahosta.domena:4433, jeśli na zaporze sieciowej używasz przekierowania portów, przez które użytkownicy łączą się z urządzeniem LiquidFiles.
      email_footer: Ten podpis będzie dodawany do wszystkich wychodzących wiadomości e-mail.
