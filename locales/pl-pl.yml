        submit_email: Wyślij
        if_you_have_account: "(jeśli masz już konto)"
        request_temporary_user_header: Poproś o nowe hasło tymczasowe
        request_temporary_user_description_html: Możesz poprosić o nowe hasło tymczasowe, aby otworzyć tę wiadomość. Wprowadź poniżej adres e-mail, aby otrzymać nowe hasło tymczasowe do tej bezpiecznej wiadomości.
        info_header: Informacje o haśle tymczasowym
        info_body_html: "<p>Hasło tymczasowe to unikalny ciąg cyfr i liter, na przykład:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>To hasło tymczasowe jest tylko przykładem, aby pokazać, jak wygląda – nie można go użyć.</em></p><p>W skrzynce odbiorczej znajdziesz <strong>dwie wiadomości</strong>: wiadomość z bezpieczną wiadomością oraz wiadomość z <strong>tematem zaczynającym się od: Hasło tymczasowe</strong>. Ta druga zawiera Twoje unikalne hasło tymczasowe do tego systemu.</p><p>Jeśli nie otrzymałeś wiadomości z hasłem tymczasowym, możliwe, że masz już konto w tym systemie. W takim przypadku kliknij „Zaloguj”.</p><p>Jeśli uważasz, że powinieneś otrzymać hasło tymczasowe, ale tak się nie stało, kliknij „Poproś o hasło tymczasowe”, aby otrzymać nowe.</p>"
        email_address: Adres e-mail
        email_not_permitted: Ten adres e-mail nie ma uprawnień do wyświetlenia tej bezpiecznej wiadomości.
        email_not_permitted_description_html: <p>Sprawdź otrzymaną wiadomość e-mail z bezpieczną wiadomością i wprowadź adres e-mail dokładnie w takiej postaci, w jakiej została wysłana.</p><p>Jeśli na przykład Twój adres może brzmieć zarówno jan.kowalski@firma.pl, jak i jkowalski@firma.pl, system nie może wiedzieć, że to ten sam adres. Jeśli bezpieczna wiadomość została wysłana na jan.kowalski@firma.pl, właśnie ten adres musisz tu wpisać.</p><p>W razie wątpliwości skontaktuj się z nadawcą bezpiecznej wiadomości.</p>
        email_can_login: Masz już konto w tym systemie
