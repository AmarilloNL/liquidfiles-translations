        description_html: "Za chwilę wyświetlisz bezpieczną wiadomość. Aby ją otworzyć, musisz wprowadzić hasło tymczasowe.<br>Hasło tymczasowe to unikalny, losowy ciąg znaków identyfikujący Ciebie. Zostało wysłane w osobnej wiadomości e-mail (temat: Hasło tymczasowe)."
