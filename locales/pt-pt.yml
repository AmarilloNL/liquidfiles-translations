        what_is_this: O que é isto?
        login: Iniciar sessão
        submit: Verificar palavra-passe temporária
        submit_email: Enviar
        if_you_have_account: "(se já tiver uma conta)"
        request_temporary_user_header: Pedir nova palavra-passe temporária
        request_temporary_user_description_html: Pode pedir uma nova palavra-passe temporária para aceder a esta mensagem. Introduza o seu endereço de e-mail abaixo para pedir uma nova palavra-passe temporária para esta mensagem segura.
        info_header: Informações sobre a palavra-passe temporária
        info_body_html: "<p>Uma palavra-passe temporária é uma sequência única de números e letras, por exemplo:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Esta palavra-passe temporária é apenas um exemplo para ver o seu aspeto; não pode ser utilizada.</em></p><p>Na sua caixa de entrada encontrará <strong>dois e-mails</strong>: o da mensagem segura e outro com um <strong>assunto que começa por: Palavra-passe temporária</strong>. Esse e-mail contém a sua palavra-passe temporária única para este sistema.</p><p>Se não recebeu nenhum e-mail com uma palavra-passe temporária, poderá já ter uma conta neste sistema. Nesse caso, clique em «Iniciar sessão».</p><p>Se acha que deveria ter recebido uma palavra-passe temporária mas tal não aconteceu, clique em «Pedir palavra-passe temporária» para obter uma nova.</p>"
        email_address: Endereço de e-mail
        email_not_permitted: Este endereço de e-mail não tem permissão para ver esta mensagem segura.
        email_not_permitted_description_html: <p>Verifique o e-mail da mensagem segura que recebeu e introduza o endereço de e-mail exatamente como foi utilizado no envio.</p><p>Por exemplo, se o seu endereço puder ser tanto joao.silva@empresa.pt como jsilva@empresa.pt, este sistema não tem forma de saber que são o mesmo. Se a mensagem segura foi enviada para joao.silva@empresa.pt, é esse o endereço que deve introduzir aqui.</p><p>Em caso de dúvida, contacte o remetente da mensagem segura.</p>
        email_can_login: Já tem uma conta neste sistema
        email_can_login_description_html: <p>Pode iniciar sessão neste sistema com este endereço de e-mail e a sua palavra-passe.</p><p>Clique no botão Iniciar sessão abaixo para entrar com a sua conta existente.</p>
        temporary_user_delivered_header: Palavra-passe temporária enviada
        temporary_user_delivered_description_html: <p>Foi enviada uma palavra-passe temporária para o seu endereço de e-mail. Verifique a sua caixa de entrada, feche esta janela e introduza a palavra-passe temporária.</p>
