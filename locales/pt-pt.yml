        description_html: <strong>Utilizadores do Windows:</strong> o Windows limita os caminhos de ficheiros a 259 caracteres. Ao carregar pastas a partir de localizações com caminhos longos, os ficheiros situados em níveis profundos da estrutura podem ser excluídos sem aviso, o que pode causar carregamentos incompletos ou pastas duplicadas.
        workarounds_title: Soluções recomendadas
        workarounds_html: "<li><strong>Utilizar uma unidade virtual:</strong> abra a Linha de comandos e execute: <code>subst X: \"C:\\o\\seu\\caminho\\longo\\para\\a\\pasta\"</code><br>Depois carregue a partir da unidade virtual <code>X:\\</code></li><li><strong>Aproximar-se dos ficheiros:</strong> navegue para uma subpasta mais próxima dos seus ficheiros antes de selecionar a pasta a carregar</li><li><strong>Utilizar um caminho mais curto:</strong> copie os seus ficheiros para uma localização mais curta, como <code>C:\\uploads\\</code>, antes de os carregar</li><li><strong>Comprimir primeiro a pasta:</strong> comprima a pasta num ficheiro ZIP e carregue antes o ficheiro ZIP</li>"
        advanced_title: "Avançado: ativar caminhos longos no Windows 10/11"
        advanced_description_html: A partir do Windows 10 versão 1607, pode ativar o suporte para caminhos mais longos. <strong>Nota:</strong> requer privilégios de administrador e pode não funcionar em todos os navegadores. As soluções acima são mais fiáveis.
        registry_steps_title: Passos para ativar caminhos longos
        registry_steps_html: "<li>Prima <kbd>Win + R</kbd>, escreva <code>regedit</code> e prima Enter</li><li>Navegue até: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Localize ou crie um valor DWORD com o nome <code>LongPathsEnabled</code> e defina-o como <code>1</code></li><li>Reinicie o computador para que a alteração tenha efeito</li><li>Teste novamente o carregamento (o suporte pode variar consoante o navegador)</li>"
        browser_disclaimer_html: "<strong>Importante:</strong> mesmo com esta definição de registo ativada, o suporte para caminhos longos varia consoante o navegador. O Chrome, o Edge e o Firefox podem continuar a aplicar o limite de 259 caracteres. As soluções acima são mais fiáveis."
