        title: Limitarea lungimii căii în Windows
        description_html: <strong>Utilizatori Windows:</strong> Windows limitează căile fișierelor la 259 de caractere. La încărcarea dosarelor din locații cu căi lungi, fișierele aflate adânc în structura de dosare pot fi omise fără avertisment, ceea ce poate duce la încărcări incomplete sau la dosare duplicate.
        workarounds_title: Soluții recomandate
        workarounds_html: "<li><strong>Utilizați o unitate virtuală:</strong> deschideți Linia de comandă și rulați: <code>subst X: \"C:\\calea\\dvs\\lunga\\catre\\dosar\"</code><br>Apoi încărcați de pe unitatea virtuală <code>X:\\</code></li><li><strong>Navigați mai aproape de fișiere:</strong> deschideți un subdosar mai apropiat de fișiere înainte de a selecta dosarul de încărcat</li><li><strong>Utilizați o cale mai scurtă:</strong> copiați fișierele într-o locație mai scurtă, cum ar fi <code>C:\\uploads\\</code>, înainte de încărcare</li><li><strong>Arhivați mai întâi dosarul:</strong> comprimați dosarul într-un fișier ZIP și încărcați în schimb fișierul ZIP</li>"
        advanced_title: "Avansat: activarea căilor lungi în Windows 10/11"
        advanced_description_html: Începând cu Windows 10 versiunea 1607, puteți activa suportul pentru căi mai lungi. <strong>Notă:</strong> acest lucru necesită drepturi de administrator și s-ar putea să nu funcționeze în toate browserele. Soluțiile de mai sus sunt mai fiabile.
        registry_steps_title: Pași pentru activarea căilor lungi
        registry_steps_html: "<li>Apăsați <kbd>Win + R</kbd>, tastați <code>regedit</code> și apăsați Enter</li><li>Navigați la: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Găsiți sau creați o valoare DWORD numită <code>LongPathsEnabled</code> și setați-o la <code>1</code></li><li>Reporniți computerul pentru ca modificarea să intre în vigoare</li><li>Testați din nou încărcarea (suportul poate varia în funcție de browser)</li>"
        browser_disclaimer_html: "<strong>Important:</strong> chiar și cu această setare de registru activată, suportul pentru căi lungi variază în funcție de browser. Chrome, Edge și Firefox pot aplica în continuare limita de 259 de caractere. Soluțiile de mai sus sunt mai fiabile."
