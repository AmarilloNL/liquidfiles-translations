        authenticate_description_html: Вы собираетесь просмотреть защищённое сообщение. Сначала необходимо войти. Чтобы продолжить, введите адрес эл. почты или войдите в систему.<br>Если у Вас нет учётной записи в этой системе, введите адрес эл. почты, и мы отправим Вам защищённую ссылку для его подтверждения.
        unauthenticated_html: <h4>Неверное имя пользователя или пароль</h4><p>Введите имя пользователя и пароль. Пароль можно сбросить с помощью кнопки «Сбросить пароль» ниже.</p>
        unauthorized_to_view_check_email_html: <h4>Неавторизованный адрес эл. почты</h4><p>Убедитесь, что защищённое сообщение [<span class="font-monospace fw-bold">%{message_id}</span>] было отправлено Вам, и введите адрес эл. почты точно так, как было адресовано сообщение.</p><p>Например, если Ваш адрес может быть как ivan.petrov@kompaniya.ru, так и ipetrov@kompaniya.ru, система не может знать, что это один и тот же адрес. Если защищённое сообщение было отправлено на ivan.petrov@kompaniya.ru, именно этот адрес нужно ввести здесь.</p><p>Если Вы не уверены, обратитесь к отправителю защищённого сообщения.</p>
