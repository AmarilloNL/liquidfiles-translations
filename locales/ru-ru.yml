      show:
        title: Введите временный пароль
        description_html: "Вы собираетесь просмотреть защищённое сообщение. Чтобы открыть его, необходимо ввести временный пароль.<br>Временный пароль — это уникальная случайная строка, идентифицирующая Вас. Временный пароль был отправлен Вам отдельным письмом (тема: Временный пароль)."
