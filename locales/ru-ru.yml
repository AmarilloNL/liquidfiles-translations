        submit: Проверить временный пароль
        submit_email: Отправить
        if_you_have_account: "(если у Вас уже есть учётная запись)"
        request_temporary_user_header: Запросить новый временный пароль
        request_temporary_user_description_html: Вы можете запросить новый временный пароль, чтобы открыть это сообщение. Введите адрес эл. почты ниже, чтобы запросить новый временный пароль для этого защищённого сообщения.
        info_header: Сведения о временном пароле
        info_body_html: "<p>Временный пароль — это уникальная последовательность цифр и букв, например:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Этот временный пароль — лишь пример того, как он выглядит; его нельзя использовать.</em></p><p>В папке «Входящие» Вы найдёте <strong>два письма</strong>: одно с защищённым сообщением и одно <strong>с темой, начинающейся со слов: Временный пароль</strong>. Во втором содержится Ваш уникальный временный пароль для этой системы.</p><p>Если Вы не получали письмо с временным паролем, возможно, у Вас уже есть учётная запись в этой системе. В этом случае нажмите «Войти».</p><p>Если Вы считаете, что должны были получить временный пароль, но не получили его, нажмите «Запросить временный пароль», чтобы получить новый.</p>"
        email_address: Адрес эл. почты
        email_not_permitted: Этому адресу эл. почты не разрешено просматривать данное защищённое сообщение.
        email_not_permitted_description_html: <p>Проверьте полученное письмо с защищённым сообщением и введите адрес эл. почты точно так, как было адресовано сообщение.</p><p>Например, если Ваш адрес может быть как ivan.petrov@kompaniya.ru, так и ipetrov@kompaniya.ru, система не может знать, что это один и тот же адрес. Если защищённое сообщение было отправлено на ivan.petrov@kompaniya.ru, именно этот адрес нужно ввести здесь.</p><p>Если Вы не уверены, обратитесь к отправителю защищённого сообщения.</p>
