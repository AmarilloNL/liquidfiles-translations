        description_html: <strong>Пользователям Windows:</strong> Windows ограничивает длину пути к файлу 259 символами. При отправке папок из расположений с длинными путями файлы, глубоко вложенные в структуру папок, могут быть пропущены без предупреждения, что приведёт к неполной отправке или дублированию папок.
        workarounds_title: Рекомендуемые решения
        workarounds_html: "<li><strong>Используйте виртуальный диск:</strong> откройте командную строку и выполните: <code>subst X: \"C:\\ochen\\dlinny\\put\\k\\papke\"</code><br>Затем отправляйте файлы с виртуального диска <code>X:\\</code></li><li><strong>Перейдите ближе к файлам:</strong> перед выбором папки для отправки откройте вложенную папку, расположенную ближе к файлам</li><li><strong>Используйте более короткий путь:</strong> перед отправкой скопируйте файлы в расположение с коротким путём, например <code>C:\\uploads\\</code></li><li><strong>Сначала сожмите папку:</strong> упакуйте папку в ZIP-файл и отправьте его</li>"
        advanced_title: "Для опытных: включение длинных путей в Windows 10/11"
        advanced_description_html: Начиная с Windows 10 версии 1607 можно включить поддержку более длинных путей. <strong>Примечание:</strong> требуются права администратора, и это может работать не во всех браузерах. Решения, приведённые выше, надёжнее.
        registry_steps_title: Порядок включения длинных путей
        registry_steps_html: "<li>Нажмите <kbd>Win + R</kbd>, введите <code>regedit</code> и нажмите Enter</li><li>Перейдите в раздел: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Найдите или создайте параметр DWORD с именем <code>LongPathsEnabled</code> и задайте значение <code>1</code></li><li>Перезагрузите компьютер, чтобы изменение вступило в силу</li><li>Повторите отправку (поддержка может различаться в зависимости от браузера)</li>"
        browser_disclaimer_html: "<strong>Важно:</strong> даже при включённом параметре реестра поддержка длинных путей зависит от браузера. Chrome, Edge и Firefox могут по-прежнему применять ограничение в 259 символов. Решения, приведённые выше, надёжнее."
