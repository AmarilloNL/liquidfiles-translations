        description_html: "Chystáte sa zobraziť zabezpečenú správu. Ak ju chcete otvoriť, musíte zadať dočasné heslo.<br>Dočasné heslo je jedinečný náhodný reťazec, ktorý vás identifikuje. Dočasné heslo vám bolo zaslané v samostatnom e-maile (predmet: Dočasné heslo)."
