        info_header: Informácie o dočasnom hesle
        info_body_html: "<p>Dočasné heslo je jedinečná postupnosť číslic a písmen, napríklad:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Toto dočasné heslo je len príklad, aby ste videli, ako vyzerá – nedá sa použiť.</em></p><p>V schránke nájdete <strong>dva e-maily</strong>: e-mail so zabezpečenou správou a e-mail s <strong>predmetom začínajúcim slovami: Dočasné heslo</strong>. Ten obsahuje vaše jedinečné dočasné heslo pre tento systém.</p><p>Ak ste e-mail s dočasným heslom nedostali, možno už v tomto systéme máte účet. V takom prípade kliknite na „Prihlásiť sa“.</p><p>Ak si myslíte, že ste mali dočasné heslo dostať, ale nestalo sa tak, kliknite na „Vyžiadať dočasné heslo“ a získajte nové.</p>"
