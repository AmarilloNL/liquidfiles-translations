      windows_path_warning:
        title: Obmedzenie dĺžky cesty vo Windows
        description_html: <strong>Používatelia Windows:</strong> Windows obmedzuje cesty k súborom na 259 znakov. Pri nahrávaní priečinkov z umiestnení s dlhými cestami môžu byť súbory hlboko v štruktúre priečinkov bez upozornenia vynechané, čo môže viesť k neúplnému nahratiu alebo duplicitným priečinkom.
        workarounds_title: Odporúčané riešenia
        workarounds_html: "<li><strong>Použite virtuálnu jednotku:</strong> otvorte príkazový riadok a spustite: <code>subst X: \"C:\\vasa\\dlha\\cesta\\k\\priecinku\"</code><br>Potom nahrávajte z virtuálnej jednotky <code>X:\\</code></li><li><strong>Prejdite bližšie k súborom:</strong> pred výberom priečinka na nahratie prejdite do podpriečinka bližšie k súborom</li><li><strong>Použite kratšiu cestu:</strong> pred nahratím skopírujte súbory do kratšieho umiestnenia, napríklad <code>C:\\uploads\\</code></li><li><strong>Najprv priečinok zbaľte:</strong> skomprimujte priečinok do súboru ZIP a nahrajte namiesto neho súbor ZIP</li>"
        advanced_title: "Pokročilé: zapnutie dlhých ciest vo Windows 10/11"
        advanced_description_html: Od Windows 10 verzie 1607 môžete zapnúť podporu dlhších ciest. <strong>Poznámka:</strong> vyžaduje to oprávnenia správcu a nemusí to fungovať vo všetkých prehliadačoch. Vyššie uvedené riešenia sú spoľahlivejšie.
        registry_steps_title: Postup zapnutia dlhých ciest
        registry_steps_html: "<li>Stlačte <kbd>Win + R</kbd>, napíšte <code>regedit</code> a stlačte Enter</li><li>Prejdite na: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Nájdite alebo vytvorte hodnotu DWORD s názvom <code>LongPathsEnabled</code> a nastavte ju na <code>1</code></li><li>Reštartujte počítač, aby sa zmena prejavila</li><li>Vyskúšajte nahrávanie znova (podpora sa môže v jednotlivých prehliadačoch líšiť)</li>"
        browser_disclaimer_html: "<strong>Dôležité:</strong> aj so zapnutým týmto nastavením registra sa podpora dlhých ciest v jednotlivých prehliadačoch líši. Chrome, Edge a Firefox môžu limit 259 znakov stále uplatňovať. Vyššie uvedené riešenia sú spoľahlivejšie."
