        login: Prijava
        submit: Preveri začasno geslo
        submit_email: Pošlji
        if_you_have_account: "(če že imate račun)"
        request_temporary_user_header: Zahtevaj novo začasno geslo
        request_temporary_user_description_html: Za dostop do tega sporočila lahko zahtevate novo začasno geslo. Spodaj vnesite svoj e-poštni naslov in zahtevajte novo začasno geslo za to varno sporočilo.
        info_header: Podatki o začasnem geslu
        info_body_html: "<p>Začasno geslo je edinstven niz številk in črk, na primer:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>To začasno geslo je samo primer, da vidite, kako je videti – ni ga mogoče uporabiti.</em></p><p>V nabiralniku boste našli <strong>dve e-poštni sporočili</strong>: sporočilo z varnim sporočilom in sporočilo z <strong>zadevo, ki se začne z: Začasno geslo</strong>. Slednje vsebuje vaše edinstveno začasno geslo za ta sistem.</p><p>Če niste prejeli e-poštnega sporočila z začasnim geslom, morda že imate račun v tem sistemu. V tem primeru kliknite »Prijava«.</p><p>Če menite, da bi morali prejeti začasno geslo, a ga niste, kliknite »Zahtevaj začasno geslo«, da prejmete novo.</p>"
        email_address: E-poštni naslov
