        title: Prijavite se za dostop do varnega sporočila
        authenticate_description_html: Ogledali si boste varno sporočilo. Najprej se morate prijaviti. Za nadaljevanje vnesite svoj e-poštni naslov ali se prijavite.<br>Če v tem sistemu nimate računa, vnesite svoj e-poštni naslov in poslali vam bomo varno povezavo za njegovo potrditev.
        unauthenticated_html: <h4>Neveljavno uporabniško ime ali geslo</h4><p>Vnesite uporabniško ime in geslo. Geslo lahko ponastavite z gumbom Ponastavitev gesla spodaj.</p>
        unauthorized_to_view_check_email_html: <h4>Nepooblaščen e-poštni naslov</h4><p>Preverite, ali vam je bilo varno sporočilo [<span class="font-monospace fw-bold">%{message_id}</span>] poslano, in vnesite e-poštni naslov natanko tako, kot je bilo sporočilo poslano.</p><p>Če je na primer vaš e-poštni naslov lahko janez.novak@podjetje.si ali jnovak@podjetje.si, sistem ne more vedeti, da gre za isti naslov. Če je bilo varno sporočilo poslano na janez.novak@podjetje.si, morate tukaj vnesti prav ta naslov.</p><p>Če niste prepričani, se obrnite na pošiljatelja varnega sporočila.</p>
