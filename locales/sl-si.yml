        email_can_login: V tem sistemu že imate račun
        email_can_login_description_html: <p>V ta sistem se lahko prijavite s tem e-poštnim naslovom in svojim geslom.</p><p>Kliknite gumb Prijava spodaj, da se prijavite z obstoječim računom.</p>
