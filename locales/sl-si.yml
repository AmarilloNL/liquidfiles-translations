      windows_path_warning:
        title: Omejitev dolžine poti v sistemu Windows
        description_html: <strong>Uporabniki sistema Windows:</strong> Windows omejuje poti datotek na 259 znakov. Pri nalaganju map z mest z dolgimi potmi so lahko datoteke globoko v strukturi map brez opozorila izpuščene, kar lahko povzroči nepopolna nalaganja ali podvojene mape.
        workarounds_title: Priporočene rešitve
        workarounds_html: "<li><strong>Uporabite navidezni pogon:</strong> odprite ukazni poziv in zaženite: <code>subst X: \"C:\\vasa\\dolga\\pot\\do\\mape\"</code><br>Nato nalagajte z navideznega pogona <code>X:\\</code></li><li><strong>Pomaknite se bliže datotekam:</strong> preden izberete mapo za nalaganje, se pomaknite v podmapo bliže datotekam</li><li><strong>Uporabite krajšo pot:</strong> pred nalaganjem kopirajte datoteke na krajše mesto, na primer <code>C:\\uploads\\</code></li><li><strong>Najprej stisnite mapo:</strong> stisnite mapo v datoteko ZIP in naložite datoteko ZIP</li>"
        advanced_title: "Napredno: omogočanje dolgih poti v sistemu Windows 10/11"
        advanced_description_html: Od različice 1607 sistema Windows 10 lahko omogočite podporo za daljše poti. <strong>Opomba:</strong> za to potrebujete skrbniške pravice, morda pa ne bo delovalo v vseh brskalnikih. Zgornje rešitve so zanesljivejše.
        registry_steps_title: Koraki za omogočanje dolgih poti
        registry_steps_html: "<li>Pritisnite <kbd>Win + R</kbd>, vnesite <code>regedit</code> in pritisnite Enter</li><li>Pojdite na: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Poiščite ali ustvarite vrednost DWORD z imenom <code>LongPathsEnabled</code> in jo nastavite na <code>1</code></li><li>Znova zaženite računalnik, da sprememba začne veljati</li><li>Znova preizkusite nalaganje (podpora se lahko razlikuje glede na brskalnik)</li>"
        browser_disclaimer_html: "<strong>Pomembno:</strong> tudi ko je ta nastavitev registra omogočena, se podpora za dolge poti razlikuje glede na brskalnik. Chrome, Edge in Firefox lahko še vedno uveljavljajo omejitev 259 znakov. Zgornje rešitve so zanesljivejše."
