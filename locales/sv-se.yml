        description_html: <strong>Windows-användare:</strong> Windows begränsar filsökvägar till 259 tecken. När du laddar upp mappar från platser med långa sökvägar kan filer djupt ner i mappstrukturen tyst utelämnas, vilket kan leda till ofullständiga uppladdningar eller dubblettmappar.
        workarounds_title: Rekommenderade lösningar
        workarounds_html: "<li><strong>Använd en virtuell enhet:</strong> öppna Kommandotolken och kör: <code>subst X: \"C:\\din\\langa\\sokvag\\till\\mappen\"</code><br>Ladda sedan upp från den virtuella enheten <code>X:\\</code></li><li><strong>Navigera närmare filerna:</strong> bläddra till en undermapp närmare dina filer innan du väljer mappen som ska laddas upp</li><li><strong>Använd en kortare sökväg:</strong> kopiera dina filer till en kortare plats, till exempel <code>C:\\uploads\\</code>, innan du laddar upp dem</li><li><strong>Zippa mappen först:</strong> komprimera mappen till en ZIP-fil och ladda upp ZIP-filen i stället</li>"
        advanced_title: "Avancerat: aktivera långa sökvägar i Windows 10/11"
        advanced_description_html: Från och med Windows 10 version 1607 kan du aktivera stöd för längre sökvägar. <strong>Obs!</strong> Det kräver administratörsbehörighet och fungerar kanske inte i alla webbläsare. Lösningarna ovan är mer tillförlitliga.
        registry_steps_title: Steg för att aktivera långa sökvägar
        registry_steps_html: "<li>Tryck på <kbd>Win + R</kbd>, skriv <code>regedit</code> och tryck på Retur</li><li>Gå till: <code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>Leta upp eller skapa ett DWORD-värde med namnet <code>LongPathsEnabled</code> och ange det till <code>1</code></li><li>Starta om datorn för att ändringen ska börja gälla</li><li>Testa uppladdningen igen (stödet kan variera mellan webbläsare)</li>"
        browser_disclaimer_html: "<strong>Viktigt:</strong> även med den här registerinställningen aktiverad varierar stödet för långa sökvägar mellan webbläsare. Chrome, Edge och Firefox kan fortfarande tillämpa gränsen på 259 tecken. Lösningarna ovan är mer tillförlitliga."
