        info_body_html: "<p>Ett tillfälligt lösenord är en unik följd av siffror och bokstäver, till exempel:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Det här tillfälliga lösenordet är bara ett exempel så att du ser hur det ser ut – det går inte att använda.</em></p><p>I din inkorg hittar du <strong>två e-postmeddelanden</strong>: ett med det säkra meddelandet och ett med ett <strong>ämne som börjar med: Tillfälligt lösenord</strong>. Det senare innehåller ditt unika tillfälliga lösenord för systemet.</p><p>Om du inte har fått något e-postmeddelande med ett tillfälligt lösenord kan det bero på att du redan har ett konto i systemet. Klicka i så fall på ”Logga in”.</p><p>Om du tror att du borde ha fått ett tillfälligt lösenord men inte har det, klicka på ”Begär tillfälligt lösenord” för att få ett nytt.</p>"
        email_address: E-postadress
        email_not_permitted: Den här e-postadressen har inte behörighet att visa det säkra meddelandet.
        email_not_permitted_description_html: <p>Kontrollera e-postmeddelandet med det säkra meddelandet som du har fått och ange e-postadressen exakt som den användes vid utskicket.</p><p>Om din e-postadress till exempel kan vara både anna.andersson@foretag.se och aandersson@foretag.se kan systemet inte veta att det är samma adress. Om det säkra meddelandet skickades till anna.andersson@foretag.se är det den adressen du måste ange här.</p><p>Om du är osäker, kontakta avsändaren av det säkra meddelandet.</p>
        email_can_login: Du har redan ett konto i systemet
        email_can_login_description_html: <p>Du kan logga in i systemet med den här e-postadressen och ditt lösenord.</p><p>Klicka på knappen Logga in nedan för att logga in med ditt befintliga konto.</p>
        temporary_user_delivered_header: Tillfälligt lösenord skickat
        temporary_user_delivered_description_html: <p>Ett tillfälligt lösenord har skickats till din e-postadress. Kontrollera din inkorg, stäng det här fönstret och ange det tillfälliga lösenordet.</p>
