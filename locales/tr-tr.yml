        browser_disclaimer_html: "<strong>Önemli:</strong> bu kayıt defteri ayarı etkin olsa bile uzun yol desteği tarayıcıya göre değişir. Chrome, Edge ve Firefox 259 karakterlik sınırı uygulamaya devam edebilir. Yukarıdaki çözümler daha güvenilirdir."
