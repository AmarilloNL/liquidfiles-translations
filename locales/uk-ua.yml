        info_header: Відомості про тимчасовий пароль
        info_body_html: "<p>Тимчасовий пароль — це унікальна послідовність цифр і літер, наприклад:</p><pre><code>3ynp-7FKa-pZS9</code></pre><p><em>Цей тимчасовий пароль — лише приклад того, як він виглядає; його не можна використати.</em></p><p>У вхідних ви знайдете <strong>два листи</strong>: один із захищеним повідомленням і один <strong>із темою, що починається словами: Тимчасовий пароль</strong>. У другому міститься ваш унікальний тимчасовий пароль для цієї системи.</p><p>Якщо ви не отримували листа з тимчасовим паролем, можливо, у вас уже є обліковий запис у цій системі. У такому разі натисніть «Увійти».</p><p>Якщо ви вважаєте, що мали отримати тимчасовий пароль, але не отримали його, натисніть «Запросити тимчасовий пароль», щоб отримати новий.</p>"
