      show:
        title: Введіть тимчасовий пароль
        description_html: "Ви збираєтеся переглянути захищене повідомлення. Щоб відкрити його, потрібно ввести тимчасовий пароль.<br>Тимчасовий пароль — це унікальний випадковий рядок, який ідентифікує вас. Тимчасовий пароль надіслано вам окремим листом (тема: Тимчасовий пароль)."
