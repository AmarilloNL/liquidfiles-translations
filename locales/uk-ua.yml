        workarounds_html: "<li><strong>Використайте віртуальний диск:</strong> відкрийте командний рядок і виконайте: <code>subst X: \"C:\\duzhe\\dovhyi\\shliakh\\do\\papky\"</code><br>Потім надсилайте файли з віртуального диска <code>X:\\</code></li><li><strong>Перейдіть ближче до файлів:</strong> перед вибором папки для надсилання відкрийте вкладену папку, розташовану ближче до файлів</li><li><strong>Використайте коротший шлях:</strong> перед надсиланням скопіюйте файли в розташування з коротким шляхом, наприклад <code>C:\\uploads\\</code></li><li><strong>Спершу стисніть папку:</strong> запакуйте папку в ZIP-файл і надішліть його</li>"
