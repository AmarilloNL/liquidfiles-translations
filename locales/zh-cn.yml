        workarounds_title: 建议的解决方法
        workarounds_html: "<li><strong>使用虚拟驱动器：</strong>打开命令提示符并运行：<code>subst X: \"C:\\hen\\chang\\de\\lujing\"</code><br>然后从虚拟驱动器 <code>X:\\</code> 上传</li><li><strong>移到更靠近文件的位置：</strong>在选择上传文件夹之前，打开更靠近文件的子文件夹</li><li><strong>使用更短的路径：</strong>上传前将文件复制到更短的位置，例如 <code>C:\\uploads\\</code></li><li><strong>先压缩文件夹：</strong>将文件夹压缩为 ZIP 文件，然后上传该 ZIP 文件</li>"
        advanced_title: "高级：在 Windows 10/11 中启用长路径"
        advanced_description_html: 从 Windows 10 版本 1607 开始，您可以启用对更长路径的支持。<strong>注意：</strong>需要管理员权限，且可能并非在所有浏览器中都有效。上述解决方法更可靠。
        registry_steps_title: 启用长路径的步骤
        registry_steps_html: "<li>按 <kbd>Win + R</kbd>，输入 <code>regedit</code> 并按 Enter</li><li>导航到：<code>HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\FileSystem</code></li><li>找到或创建名为 <code>LongPathsEnabled</code> 的 DWORD 值，并将其设为 <code>1</code></li><li>重新启动计算机使更改生效</li><li>再次尝试上传（支持情况可能因浏览器而异）</li>"
        browser_disclaimer_html: "<strong>重要：</strong>即使启用了此注册表设置，长路径的支持情况仍因浏览器而异。Chrome、Edge 和 Firefox 可能仍会强制执行 259 个字符的限制。上述解决方法更可靠。"
